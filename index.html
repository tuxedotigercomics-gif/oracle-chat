async function openCameraModal(){
  if(staticMode||guestMode)return;
  stopCameraStream();
  modal=`<div class="modal-backdrop" id="mb"><div class="modal"><h3>See this</h3>
    <p>Show the Mac webcam one still frame. The image goes only to the local Ollama vision model — never to a cloud service, and it is not saved in chat history.</p>
    <div class="camera-stage"><video id="camVideo" autoplay playsinline></video><canvas id="camCanvas" style="display:none"></canvas></div>
    <label>Question</label><input id="camQuestion" value="What do you see?" maxlength="200"/>
    <p class="camera-note" id="camNote">Allow camera access, then capture a frame. You can retake it before asking.</p>
    <div class="modal-actions"><button class="btn" id="camCapture">Capture</button><button class="btn primary" id="camAsk" disabled>Ask Oracle</button><button class="btn" id="mc">Cancel</button></div></div></div>`;
  render();
  const video=document.getElementById('camVideo'),canvas=document.getElementById('camCanvas');
  const note=document.getElementById('camNote'),capture=document.getElementById('camCapture'),ask=document.getElementById('camAsk');
  if(!navigator.mediaDevices?.getUserMedia){note.textContent='Camera access is not available in this browser.';return}
  try{
    cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},audio:false});
    video.srcObject=cameraStream;await video.play();
  }catch(e){note.textContent='Camera unavailable: '+(e?.name||'permission denied');return}
  capture.onclick=()=>{
    if(cameraShot){
      cameraShot=null;canvas.style.display='none';video.style.display='block';
      capture.textContent='Capture';ask.disabled=true;note.textContent='Frame cleared — capture again when ready.';return;
    }
    const vw=video.videoWidth||1280,vh=video.videoHeight||960;
    const scale=Math.min(1,1024/Math.max(vw,vh));
    canvas.width=Math.round(vw*scale);canvas.height=Math.round(vh*scale);
    const ctx=canvas.getContext('2d');
    ctx.translate(canvas.width,0);ctx.scale(-1,1);ctx.drawImage(video,0,0,canvas.width,canvas.height);
    cameraShot=canvas.toDataURL('image/jpeg',0.82).split(',')[1];
    video.style.display='none';canvas.style.display='block';
    capture.textContent='Retake';ask.disabled=false;
    note.textContent='Frame captured privately on this Mac. Ask Oracle when ready.';
  };
  ask.onclick=async()=>{
    if(!cameraShot)return;
    ask.disabled=true;const original=ask.textContent;ask.textContent='Asking…';
    note.textContent='The local vision model is looking at the frame…';
    try{
      const q=document.getElementById('camQuestion').value.trim()||'What do you see?';
      const d=await api('/api/vision',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({image:cameraShot,question:q,personality:personalityPrompt(active())})});
      if(d.error)throw new Error(d.error);
      const c=active();
      c.messages.push({from:'user',text:'[See this] '+q});
      c.messages.push({from:'bot',text:String(d.answer||'').trim()||'I could not describe that frame.',note:d.note||'Local vision'});
      c.preview='See this: '+q;saveState();stopCameraStream();modal=null;render();
      showToast('Vision answer added');
    }catch(e){
      note.textContent='Vision failed: '+e.message;ask.disabled=false;ask.textContent=original;
    }
  };
}

  modal=`<div class="modal-backdrop" id="mb"><div class="modal"><h3>Teach a Skill</h3><p>Adds an instruction the model sees on every message.</p><form id="skillForm"><label>Skill name</label><input id="sk" placeholder="e.g. Be concise" required/><label>Instructions</label><textarea id="sd" rows="3" placeholder="What should it do?"></textarea><div class="modal-actions"><button type="button" class="btn" id="mc">Cancel</button><button class="btn primary" type="submit">Save skill</button></div></form></div></div>`;render();
}
function openNameModal(){
  modal=`<div class="modal-backdrop" id="mb"><div class="modal"><h3>Change display name</h3><p>Only used in the sidebar on this Mac.</p><form id="nameForm"><label>Display name</label><input id="dn" value="${esc(displayName)}" maxlength="40" required autofocus onfocus="this.select()" onclick="this.select()"/><div class="modal-actions"><button type="button" class="btn" id="mc">Cancel</button><button class="btn primary" type="submit">Save name</button></div></form></div></div>`;render();
}
function bindModal(){
  document.getElementById('mc')?.addEventListener('click',()=>{stopCameraStream();modal=null;render()});
  document.getElementById('mb')?.addEventListener('click',e=>{if(e.target.id==='mb'){stopCameraStream();modal=null;render()}});
  const rh=document.getElementById('rh');
  if(rh)document.querySelectorAll('[data-hero-field="rh"]').forEach(b=>b.classList.toggle('selected',b.dataset.hero===rh.value));
  document.querySelectorAll('[data-hero]').forEach(b=>b.onclick=()=>{
    const field=b.dataset.heroField||'rh',input=document.getElementById(field);
    if(input)input.value=b.dataset.hero;
    document.querySelectorAll(`[data-hero-field="${field}"]`).forEach(x=>x.classList.toggle('selected',x===b));
  });
  document.getElementById('rf')?.addEventListener('change',e=>{
    const n=document.getElementById('rfNew');if(!n)return;
    n.style.display=e.target.value==='__new__'?'block':'none';
    if(e.target.value==='__new__')n.focus();
  });
  document.getElementById('roomForm')?.addEventListener('submit',e=>{
    e.preventDefault();
    const name=document.getElementById('rn').value.trim(),heroId=document.getElementById('rh').value;
    const job=(document.getElementById('rj')?.value.trim()||'General assistant');
    const primary=!!document.getElementById('rp')?.checked;
    const persona=document.getElementById('rp-tone')?.value||'oracle';
    let folder=document.getElementById('rf').value;
    if(!name)return;
    if(folder==='__new__'){
      const newName=document.getElementById('rfNew').value.trim();
      if(!newName){showToast('Enter a folder name');return}
      const nf={id:'folder-'+Date.now().toString(36),name:newName,open:true};
      folders.push(nf);folder=nf.id;
    }
    const id='chat-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    if(primary)convs.forEach(x=>x.primary=false);
    convs.push({id,name,preview:'Ask me anything…',hero:heroId,folder,job,persona,primary:primary||convs.length===0,messages:[]});
    const f=folders.find(x=>x.id===folder);if(f){f.open=true;activeFolder=f.id}
    activeId=id;mobileView='chat';modal=null;saveState();render();showToast('Room created: '+name);
  });
  document.getElementById('folderForm')?.addEventListener('submit',e=>{
    e.preventDefault();
    const id=document.getElementById('foId').value.trim(),name=document.getElementById('fn').value.trim();
    if(!name)return;
    const f=id?folders.find(x=>x.id===id):null;
    if(f)f.name=name;else folders.push({id:'folder-'+Date.now().toString(36),name,open:true});
    modal=null;saveState();render();showToast(f?'Folder renamed':'Folder created: '+name);
  });
  document.getElementById('renameForm')?.addEventListener('submit',e=>{
    e.preventDefault();
    const kind=document.getElementById('reKind').value,id=document.getElementById('reId').value,name=document.getElementById('rv').value.trim();
    const item=kind==='chat'?convs.find(x=>x.id===id):folders.find(x=>x.id===id);
    if(item&&name){item.name=name;saveState();showToast('Renamed to '+name)}
    modal=null;render();
  });
  document.querySelectorAll('[data-fm]').forEach(b=>b.onclick=()=>{
    const act=b.dataset.fm,id=b.dataset.id;modal=null;
    if(act==='rename')openRenameModal('folder',id);
    if(act==='new')openRoomModal(id);
    if(act==='share')makeFamilyFolderLink(id);
    if(act==='delete'){
      const f=folders.find(x=>x.id===id);
      if(folders.length===1){render();showToast('Keep at least one folder');return}
      const target=folders.find(x=>x.id!==id);
      convs.filter(x=>x.folder===id).forEach(x=>{x.folder=target.id});
      folders=folders.filter(x=>x.id!==id);
      if(activeFolder===id)activeFolder=target.id;
      saveState();render();showToast('Folder removed; its chats were kept');
    }
  });
  document.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>{
    const act=b.dataset.cm,id=b.dataset.id;modal=null;
    if(act==='rename')openRenameModal('chat',id);
    if(act==='move')openMoveModal(id);
    if(act.startsWith('smart-'))smartChat(act.slice(6),id);
    if(act==='share'){activeId=id;openShareModal()}
    if(act==='delete')openDeleteChatModal(id);
  });
  document.querySelectorAll('[data-move-chat]').forEach(b=>b.onclick=()=>{modal=null;moveChat(b.dataset.moveChat,b.dataset.moveFolder)});
  document.querySelectorAll('[data-smart-use]').forEach(b=>b.onclick=()=>{modal=null;moveChat(b.dataset.smartChat,b.dataset.smartUse)});
  document.getElementById('smartCreate')?.addEventListener('click',e=>{
    const name=e.currentTarget.dataset.smartName,chatId=e.currentTarget.dataset.smartChat;
    let f=folders.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!f){f={id:'folder-'+Date.now().toString(36),name,open:true};folders.push(f)}
    modal=null;moveChat(chatId,f.id);
  });
  document.getElementById('confirmDeleteChat')?.addEventListener('click',e=>{
    const id=e.currentTarget.dataset.id,idx=convs.findIndex(x=>x.id===id);
    if(idx>=0&&convs.length>1){
      convs.splice(idx,1);
      if(activeId===id)activeId=convs[0].id;
      activeFolder=convs[0].folder;saveState();showToast('Chat deleted');
    }
    modal=null;render();
  });
  document.getElementById('shareCopy')?.addEventListener('click',async()=>{
    const t=document.getElementById('shareText');t.select();
    try{await navigator.clipboard.writeText(t.value)}catch(err){document.execCommand('copy')}
    showToast('Transcript copied');
  });
  document.getElementById('shareDownload')?.addEventListener('click',()=>{
    const t=document.getElementById('shareText'),blob=new Blob([t.value],{type:'text/plain'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=(active().name||'oracle-chat').replace(/[^a-z0-9_-]+/gi,'-')+'.txt';
    document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);showToast('Transcript downloaded');
  });
  function makeFamilyLink(includeChat){
    const c=active();
    const payload=includeChat?{chat:{id:c.id,name:c.name,hero:c.hero,messages:c.messages}}:{own:true};
    openLinkModal(staticShareLink(payload),includeChat?'Family link with this chat':'Family link');
  }
  document.getElementById('shareFamilyOwn')?.addEventListener('click',()=>makeFamilyLink(false));
  document.getElementById('shareFamilyChat')?.addEventListener('click',()=>makeFamilyLink(true));
  document.getElementById('copyShareLink')?.addEventListener('click',async()=>{
    const t=document.getElementById('shareLinkText');t.select();
    try{await navigator.clipboard.writeText(t.value)}catch(err){document.execCommand('copy')}
    showToast('Share link copied');
  });
  document.getElementById('guestStart')?.addEventListener('click',()=>guestChoose('own'));
  document.getElementById('guestContinue')?.addEventListener('click',()=>guestChoose('chat'));
  document.getElementById('guestFolder')?.addEventListener('click',()=>guestChoose('folder'));
  document.getElementById('guestChooseDone')?.addEventListener('click',()=>guestChoose('own'));
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{if(!credSelected.includes(b.dataset.pick))credSelected.push(b.dataset.pick);modal=null;render();showToast('Selected '+b.dataset.pick+' (value hidden)')});
  document.getElementById('credForm')?.addEventListener('submit',async e=>{
    e.preventDefault();const key=document.getElementById('ck').value.trim(),value=document.getElementById('cv').value;
    const r=await api('/api/vault/set',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,value})});
    modal=null;if(r.ok){showToast('Saved to Keychain: '+key)}else{showToast('Could not save: '+(r.error||'unknown'))}
    vaultKeys=(await api('/api/vault/list')).keys;render();
  });
  document.getElementById('nameForm')?.addEventListener('submit',e=>{
    e.preventDefault();const v=document.getElementById('dn').value.trim();
    if(v){displayName=v;localStorage.setItem('oracle.displayName',v)}
    modal=null;render();if(v)showToast('Name updated: '+v);
  });
  document.getElementById('skillForm')?.addEventListener('submit',async e=>{
    e.preventDefault();const name=document.getElementById('sk').value.trim(),desc=document.getElementById('sd').value.trim();
    await api('/api/skills',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,desc})});
    modal=null;render();showToast('Skill saved: '+name);
  });
}

function noteOf(r){return [r.backend&&'backend: '+r.backend,r.note].filter(Boolean).join(' · ')}

async function toolAction(idx,decision='once'){
  const c=active(), m=c.messages[idx];
  if(!m||!(m.toolState==='pending'||m.toolState==='working'))return;
  const approved=decision===true||decision==='once'||decision==='always'||decision==='auto';
  if(decision==='always'){
    const key=toolKey(m.tool);
    if(key&&!toolRules.includes(key)){toolRules.push(key);saveToolRules()}
    else if(!key)showToast('This action is too large to save as a rule — approved once instead');
  }
  m.toolDecision=decision===true?'once':decision;
  m.toolState='working';waiting=true;render();
  let result=null;
  if(approved){
    try{result=await api('/api/tool/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tool:m.tool,approved:true})})}
    catch(err){result={ok:false,error:err.message}}
    m.toolResult=result;m.toolState=result.ok?'done':'error';
  }else{
    m.toolResult={ok:false,error:'Denied by you.'};m.toolState='denied';
  }
  render();await followUp(idx,result);
}

async function followUp(idx,result){
  const c=active(),m=c.messages[idx];
  const prior=c.messages.slice(0,idx).map(x=>({from:x.from,text:x.text}));
  const body={messages:prior,backend,credentials:credSelected};
  if(m.toolState==='denied')body.toolDenied=true;
  if(result)body.toolResult=result;
  try{
    const r=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    c.messages.push({from:'bot',text:r.answer||'(no answer)',note:noteOf(r)});
    c.preview=(r.answer||'').slice(0,40);
  }catch(err){c.messages.push({from:'bot',text:'Bridge error: '+err.message,note:'Start the bridge from the Desktop launcher.'})}
  afterReply(c.messages.at(-1)?.text||'');
}

async function sendMessage(e){
  e.preventDefault();
  const text=draft.trim();if(!text&&!files.length)return;
  const extra=(files.length?'\n[Attached files: '+files.join(', ')+']':'');
  const c=active();
  c.messages.push({from:'user',text:text+extra});c.preview=(text||'file')+'…';
  // Save now — if a phone tab is killed while the model loads, the question
  // survives the reload and can be retried instead of vanishing.
  saveState();
  draft='';files=[];waiting=true;if(callActive)setCallState('thinking');render();
  // render() rebuilds the input; refocus it so the phone keyboard stays open
  // instead of looking like the page jumped or reset.
  if(!callActive){const el=document.getElementById('draft');if(el){try{el.focus({preventScroll:true})}catch(e){}}}
  let replyText='',delegated=false;
  const cm=customModels.find(m=>m.id===backend);
  const shortSend=nextSendShort;nextSendShort=false;
  try{
    const msgs=c.messages.map(m=>({from:m.from,text:m.text}));
    let sysText=personalityPrompt(c)||'',sources=null;
    if(webSearchOn()&&staticMode&&!guestMode&&(backend==='device'||backend==='device-small'||backend==='device-smart'||backend==='device-free'||(cm&&cm.type==='device')||(cm&&cm.type==='cloud'))){
      sources=await webSources(text);
      if(sources&&sources.items.length){
        sysText=(sysText?sysText+'\n\n':'')+'Current web sources for this question. Use them for facts that may have changed recently; say so if they do not answer the question:\n'+sources.text;
      }else sources=null;
    }
    if(sysText)msgs.unshift({from:'system',text:sysText});
    if(credSelected.length)msgs.push({from:'user',text:'[Saved credentials available by name only: '+credSelected.join(', ')+'. Never ask for their values.]'});
    if(backend==='device'||backend==='device-small'||backend==='device-smart'||backend==='device-free'||(cm&&cm.type==='device')){
      const answer=await deviceChat(msgs,activeDeviceModel(),shortSend);
      c.messages.push({from:'bot',text:answer,note:(cm?cm.name:'On-device')+' · private'+(sources?' · '+sources.items.length+' web sources':''),sources:sources?sources.items:null});
      c.preview=answer.slice(0,40);replyText=answer;
    }else if(cm&&cm.type==='cloud'){
      const answer=await customCloudChat(cm,msgs);
      c.messages.push({from:'bot',text:answer,note:cm.name+' · your provider'+(sources?' · '+sources.items.length+' web sources':''),sources:sources?sources.items:null});
      c.preview=answer.slice(0,40);replyText=answer;
    }else{
      const r=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,backend,credentials:credSelected})});
      if(r.tool){
        const auto=r.needsApproval&&toolAutoAllowed(r.tool);
        const m={from:'bot',text:r.answer||'',note:noteOf(r),tool:r.tool,toolSummary:r.toolSummary,
                 needsApproval:r.needsApproval,toolState:(r.needsApproval&&!auto)?'pending':'working',
                 toolDecision:auto?'auto':null};
        c.messages.push(m);replyText=r.answer||'';
        render();
        if(!r.needsApproval||auto){delegated=true;await toolAction(c.messages.indexOf(m),auto?'auto':true)}
      }else{
        c.messages.push({from:'bot',text:r.answer||'(no answer)',note:noteOf(r)});
        c.preview=(r.answer||'').slice(0,40);replyText=r.answer||'';
      }
    }
  }catch(err){
    const own=backend==='device'||backend==='device-small'||backend==='device-smart'||backend==='device-free'||!!cm;
    c.messages.push({from:'bot',text:(own?'Model error: ':'Bridge error: ')+err.message,retryable:own,
      note:own?(cm?.type==='cloud'?'Check the endpoint and key':'Try another model'):'Start the bridge from the Desktop launcher.'});
    replyText='';
  }
  if(!delegated){const last=c.messages.at(-1)?.text||replyText;afterReply(last)}
}
