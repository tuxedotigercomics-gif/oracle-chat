<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oracle · Chat (Live)</title>
<style>
  :root{
    --sidebar-bg:#f5f5f5; --sidebar-active:#e4e4e4; --sidebar-hover:#ececec;
    --main-bg:#f0f0f0; --surface:#fff; --border:#e2e2e2;
    --text:#1f1f1f; --muted:#6b6b6b; --accent:#4a9861; --danger:#c0392b;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--main-bg);-webkit-font-smoothing:antialiased}
  button,input,textarea{font:inherit;color:inherit}
  .app{display:flex;height:100vh;width:100%;overflow:hidden}

  .sidebar{width:20%;min-width:230px;max-width:320px;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column}
  .sidebar-top{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px}
  .workspace{display:flex;align-items:baseline;gap:4px;min-width:0}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);align-self:center;margin-right:2px}
  .workspace-name{font-weight:650;font-size:15px}
  .workspace-sub{color:var(--muted);font-size:13px}
  .icon-btn{background:transparent;border:none;border-radius:8px;padding:6px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
  .icon-btn:hover{background:var(--sidebar-hover);color:var(--text)}
  .icon-btn.active{background:#e7f4ea;color:#2f7d47}
  .icon-btn.listening{background:#fdecec;color:#c0392b;animation:agent-wave .6s ease-in-out infinite alternate}
  .icon-btn.calling{background:#fdecec;color:#c0392b;animation:agent-wave .6s ease-in-out infinite alternate}
  .call-bar{display:flex;align-items:center;gap:8px;padding:7px 14px;background:#eef6f0;border-top:1px solid var(--border);font-size:12px;color:#2f7d47;font-weight:600}
  .call-dot{width:9px;height:9px;border-radius:50%;background:#2f7d47;animation:agent-wave .6s ease-in-out infinite alternate}
  .call-bar.thinking{background:#fff8e8;color:#9a6b00}.call-bar.thinking .call-dot{background:#e0a500}
  .call-bar.speaking{background:#eef0ff;color:#4a4ab0}.call-bar.speaking .call-dot{background:#5a5ad0}
  .call-bar button{margin-left:auto;border:0;background:#c0392b;color:#fff;border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer}
  .section-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 14px 4px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
  .mini-add{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;border-radius:6px;padding:2px 5px}
  .mini-add:hover{background:var(--sidebar-hover);color:var(--text)}
  .view-tabs{gap:5px;align-items:center;padding-right:10px}
  .view-tabs>button[data-list-view]{background:transparent;border:none;border-radius:7px;padding:3px 7px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);cursor:pointer}
  .view-tabs>button[data-list-view]:hover{background:var(--sidebar-hover)}
  .view-tabs>button[data-list-view].active{background:var(--sidebar-active);color:var(--text)}
  .view-tabs .mini-add{margin-left:auto}
  .drop-chips{display:flex;flex-wrap:wrap;gap:5px;padding:5px 10px 8px}
  .drop-chip{background:#fff;border:1px dashed #bbb;border-radius:12px;padding:3px 9px;font-size:11px;color:var(--muted);cursor:pointer}
  .drop-chip:hover{border-color:var(--accent);color:var(--text)}
  .drop-chip.drag-over{background:#e7f4ea;border-color:var(--accent);color:#2f7d47}
  .folder-head.drag-over{outline:2px dashed var(--accent);background:#e7f4ea}
  .conv-wrap.dragging{opacity:.45}
  .nav-item{display:flex;align-items:center;gap:9px;width:calc(100% - 16px);margin:0 8px 2px;text-align:left;background:transparent;border:none;border-radius:9px;padding:8px 10px;font-size:13.5px;cursor:pointer}
  .nav-item:hover{background:var(--sidebar-hover)}
  .nav-item.active{background:var(--sidebar-active)}
  .folder-list{flex:1;overflow-y:auto;padding:4px 8px}
  .folder-head{display:flex;align-items:center;border-radius:9px}
  .folder-head:hover{background:var(--sidebar-hover)}
  .folder-head.current{background:var(--sidebar-active)}
  .folder-row{display:flex;align-items:center;gap:6px;flex:1;min-width:0;text-align:left;background:transparent;border:none;border-radius:9px;padding:7px 2px 7px 7px;font-size:13.5px;font-weight:650;cursor:pointer;color:var(--text)}
  .folder-caret{width:12px;color:var(--muted);font-size:11px}
  .folder-glyph{font-size:13px}
  .folder-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .folder-count{font-size:11px;color:var(--muted);font-weight:500}
  .row-action{background:transparent;border:none;color:var(--muted);cursor:pointer;border-radius:6px;padding:2px 5px;font-size:13px;line-height:1}
  .row-action:hover{background:#ddd;color:var(--text)}
  .folder-chats{padding:1px 0 5px 18px}
  .conv-list{flex:1;overflow-y:auto;padding:4px 8px}
  .conv-wrap{display:flex;align-items:center;border-radius:10px}
  .conv-wrap:hover{background:var(--sidebar-hover)}
  .conv-wrap.active{background:var(--sidebar-active);box-shadow:inset 3px 0 var(--hero,var(--accent))}
  .conv{display:flex;align-items:center;gap:8px;flex:1;min-width:0;text-align:left;background:transparent;border:none;border-radius:10px;padding:7px 3px 7px 8px;margin-bottom:2px;cursor:pointer}
  .conv:hover{background:var(--sidebar-hover)}
  .conv.active{background:var(--sidebar-active)}
  .conv-body{display:flex;flex-direction:column;align-items:flex-start;min-width:0;flex:1}
  .conv-name{font-size:13.5px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .conv-preview{font-size:12.5px;color:var(--muted);line-height:1.3;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .empty-folder{font-size:12px;color:var(--muted);padding:5px 10px 7px}
  .new-in-folder{background:transparent;border:none;color:var(--muted);font-size:11.5px;cursor:pointer;padding:4px 10px 6px;border-radius:8px}
  .new-in-folder:hover{background:var(--sidebar-hover);color:var(--text)}
  .agent-avatar{position:relative;width:26px;height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#e8e8e8;border:1px solid var(--hero,var(--border));border-radius:7px}
  .agent-avatar svg{width:24px;height:24px}
  .agent-avatar.walking{animation:agent-walk 1.1s ease-in-out infinite}
  .agent-avatar.asking::after{content:"";position:absolute;right:-3px;top:-4px;width:6px;height:10px;background:#ffd166;border:1px solid #8a6d1f;transform-origin:bottom center;animation:agent-wave .7s ease-in-out infinite alternate}
  @keyframes agent-walk{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-3px) rotate(2deg)}}
  @keyframes agent-wave{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
  .profile{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:none;border-top:1px solid var(--border);background:transparent;text-align:left;cursor:pointer;font:inherit;color:inherit}
  .profile:hover,.profile.open{background:var(--sidebar-hover)}
  .avatar{width:32px;height:32px;border-radius:50%;background:#d8d8d8;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
  .profile-info{display:flex;flex-direction:column;min-width:0}
  .profile-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .profile-sub{font-size:11.5px;color:var(--muted)}
  .profile-caret{margin-left:auto;color:var(--muted);font-size:14px;line-height:1}
  .dropdown.profile-menu{bottom:60px;left:8px;min-width:220px}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--main-bg)}
  .chat-header{height:56px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:relative;z-index:45}
  .chat-title-name{font-size:15px;font-weight:650;min-width:0;overflow:hidden}
  .chat-name-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .model-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .header-actions{display:flex;align-items:center;gap:8px}
  .model-pill{display:inline-flex;align-items:center;gap:6px;background:#f6f6f6;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer}
  .model-pill:hover{background:#efefef}
  .model-pill .caret{color:var(--muted);font-size:10px}
  .share-btn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
  .share-btn:hover{background:var(--main-bg)}
  .status-dot{font-size:11px;padding:3px 7px;border-radius:8px;background:#e6f2e9;color:#2f7d47}
  .status-dot.off{background:#f3e6e6;color:#a33}
  .messages{flex:1;overflow-y:auto;padding:24px 20px}
  .messages-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  .row{display:flex}
  .row.user{justify-content:flex-start}
  .row.bot{justify-content:flex-end}
  .bubble{max-width:78%;padding:11px 15px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .bubble.user{background:transparent;padding-left:0}
  .bubble.bot{background:var(--hero,var(--accent));color:#fff;border-bottom-right-radius:4px}
  .meta{font-size:11px;color:var(--muted);margin-top:5px;font-style:italic}
  .status{font-size:12.5px;color:var(--muted);font-style:italic;align-self:flex-start;padding-left:2px}
  .composer-wrap{flex-shrink:0;width:calc(100% - 40px);max-width:760px;margin:0 auto 18px}
  .attach-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#e8e8e8;border-radius:8px;padding:4px 8px;font-size:12px}
  .chip button{background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;line-height:1;padding:0}
  .composer{background:var(--surface);border:1px solid var(--border);border-radius:14px;display:flex;align-items:center;gap:8px;padding:8px 10px;box-shadow:0 2px 10px rgba(0,0,0,.04);position:relative}
  .composer-plus{background:transparent;border:none;border-radius:8px;padding:6px;cursor:pointer;color:var(--muted);display:flex}
  .composer-plus:hover,.composer-plus.open{background:var(--main-bg);color:var(--text)}
  .composer input{flex:1;border:none;outline:none;background:transparent;font-size:14px;padding:6px 4px}
  .composer input::placeholder{color:#9a9a9a}
  .composer-send{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:7px 9px;cursor:pointer;display:flex}
  .composer-send:disabled{background:#cfcfcf;cursor:default}

  .backdrop{position:fixed;inset:0;z-index:40}
  .dropdown{position:absolute;z-index:50;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.14);padding:6px;min-width:190px}
  .dropdown.model{top:48px;right:20px}
  .dropdown.more{top:48px;right:88px;min-width:215px}
  .dropdown.plus{bottom:54px;left:10px}
  .menu-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;border-radius:8px;padding:9px 10px;font-size:13.5px;cursor:pointer}
  .menu-item:hover{background:var(--main-bg)}
  .menu-item .mi-sub{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
  .mi-note{font-size:11px;color:var(--muted);line-height:1.4;padding:4px 10px 8px}
  .model-remove{margin-left:auto;color:var(--muted);font-size:12px;padding:3px 5px;border-radius:6px;cursor:pointer}
  .model-remove:hover{background:#fdecea;color:#b3261e}
  .menu-sep{height:1px;background:var(--border);margin:5px 4px}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:60}
  .modal{background:#fff;border-radius:16px;padding:22px;width:min(440px,92vw);max-height:86vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.2)}
  .modal h3{margin:0 0 4px;font-size:17px}
  .modal p{margin:0 0 14px;font-size:13px;color:var(--muted)}
  .modal label{display:block;font-size:12.5px;font-weight:600;margin:12px 0 5px}
  .modal input,.modal textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-size:13.5px;outline:none;resize:vertical}
  .modal input:focus,.modal textarea:focus{border-color:var(--accent)}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
  .vault-row{display:flex;align-items:center;justify-content:space-between;background:var(--main-bg);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px}
  .vault-row code{font-size:12px;color:var(--muted)}
  .tool-card{margin-top:9px;border:1px solid var(--border);border-radius:10px;background:#fff;padding:9px 10px;max-width:420px}
  .tool-title{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#2f7d47}
  .tool-preview{margin:7px 0 0;max-height:110px;overflow:auto;background:var(--main-bg);border-radius:6px;padding:6px 8px;font-size:11px;white-space:pre-wrap;word-break:break-word;color:#444}
  .tool-actions{display:flex;gap:8px;margin-top:9px}
  .tool-actions .btn{padding:5px 10px;font-size:12px}
  .hero-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:220px;overflow:auto;margin-top:8px}
  .hero-choice{display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:6px 2px;cursor:pointer;font-size:10px;color:var(--muted)}
  .hero-choice:hover{background:var(--main-bg)}
  .hero-choice.selected{border-color:var(--accent);background:#eef7f0;color:var(--text);font-weight:600}
  .hero-choice .agent-avatar{width:30px;height:30px}
  .hero-choice .agent-avatar svg{width:28px;height:28px}
  .share-text{width:100%;height:180px;font-family:ui-monospace,Menlo,monospace;font-size:11px}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:80vw}
  svg{flex-shrink:0}
  @media(max-width:640px){
    .sidebar{width:38%;min-width:124px;max-width:200px}
    .sidebar-top{padding:10px 7px 8px;gap:3px}
    .workspace-name{font-size:12.5px}
    .workspace-sub{display:none}
    .section-label{padding:6px 7px 4px}
    .view-tabs{padding-right:4px;gap:1px}
    .view-tabs>button[data-list-view]{padding:3px 4px;font-size:9.5px;letter-spacing:0}
    .view-tabs .mini-add{padding:2px 3px;font-size:13px}
    .nav-item{width:calc(100% - 10px);margin:0 5px 2px;padding:7px 5px;gap:5px;font-size:11.5px}
    .folder-list,.conv-list{padding:4px 5px}
    .folder-row{font-size:11.5px;gap:3px;padding-left:3px}
    .folder-caret{width:9px;font-size:10px}
    .folder-glyph{font-size:11px}
    .folder-count{display:none}
    .folder-chats{padding-left:7px}
    .conv{gap:4px;padding:6px 2px 6px 4px}
    .conv-name{font-size:11.5px}
    .conv-preview{font-size:10.5px}
    .agent-avatar{width:22px;height:22px;border-radius:6px}
    .agent-avatar svg{width:20px;height:20px}
    .profile{padding:8px 6px;gap:5px}
    .avatar{width:26px;height:26px;font-size:10px}
    .profile-name{font-size:10.5px}
    .profile-sub,.profile-caret{display:none}
    .dropdown.profile-menu{left:0;min-width:190px}
    .chat-header{padding:0 6px;gap:3px}
    .chat-title-name{flex:1 1 auto;min-width:0}
    .chat-name-text{min-width:0}
    .header-actions{flex:0 0 auto;gap:0;flex-wrap:nowrap}
    .header-actions .status-dot{display:none}
    .header-actions #voiceBtn{display:none}
    .model-pill{max-width:64px;padding:6px 4px;font-size:10.5px}
    .share-btn{padding:6px;font-size:0;gap:0}
    .icon-btn{padding:5px}
    .dropdown.model{right:6px;top:46px;min-width:170px}
    .dropdown.more{right:6px;top:46px;min-width:190px;max-width:calc(100vw - 20px)}
    .messages{padding:14px 10px}
    .bubble{max-width:88%;font-size:13px}
    .composer-wrap{width:calc(100% - 14px)}
    .composer input{font-size:13px}
    .call-bar{padding:6px 8px;font-size:11px}
  }
  @media(max-width:360px){
    .sidebar{width:36%;min-width:112px}
    .model-pill{max-width:54px}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const ICONS={
  search:'<circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/>',
  more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  arrow:'<line x1="22" y1="12" x2="4" y2="12"/><polyline points="10 6 4 12 10 18"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><polyline points="14 2 14 8 20 8"/>',
  spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8Z"/>',
  lock:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
  chat:'<path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/>',
  mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/>',
  volume:'<path d="M11 5 6 9H3v6h3l5 4Z"/><path d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/>',
  phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/>',
};
function icon(n,s=18){return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

const SPRITES={
  mask:[".HHHHHH.","HHHHHHHH","HAFFFFAH","HAFEEFAH","HAFFFFAH","HAFSSFAH",".HASSAH.","..HHHH.."],
  hair:["..HHHH..",".HHHHHH.","HHFFFFHH","HFEFFEFH","HFFFFFFH",".HFAFAH.","..FFFF..","..SSSS.."],
  helmet:["..AAAA..",".AHHHHA.","AHHEEHHA","AFFFFFFA","AFFSSFFA",".AFSSFA.","..FFFF..","..SSSS.."],
  horns:["A......A","AA....AA",".AHHHHA.",".HFEEFH.",".HFFFFH.","..FAAF..","..FFFF..","..SSSS.."],
  visor:["..HHHH..",".HHHHHH.","HHAAAAHH","HAEEEEAH","HFFFFFFH",".HFAFAH.","..FFFF..","..SSSS.."],
  cape:["..HHHH..",".HHHHHH.",".HFFFFH.","AFEEEEFA","FFFFFFFF",".FAFFAF.","AAFFFFAA","SSSSSSSS"],
  armor:["..AAAA..",".AHHHHA.","AHHEEHHA","AFFFFFFA","AFFSSFFA","AFFSSFFA",".AFFFFA.","..AAAA.."],

let gvKey=null, gvCache={};
const vaultId=shareToken||'self';

async function gvInit(){
  if(!('crypto' in window&&crypto.subtle))return;
  const kk='oracle.guest.vaultkey.'+vaultId;
  let raw=localStorage.getItem(kk);
  if(raw)gvKey=await crypto.subtle.importKey('raw',gvUnb64(raw),'AES-GCM',false,['encrypt','decrypt']);
  else{const r=crypto.getRandomValues(new Uint8Array(32));gvKey=await crypto.subtle.importKey('raw',r,'AES-GCM',false,['encrypt','decrypt']);localStorage.setItem(kk,gvB64(r))}
  const v=localStorage.getItem('oracle.guest.vault.'+vaultId);
  if(v){try{gvCache=JSON.parse(v)}catch(e){gvCache={}}}
}
async function gvSet(name,value){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const buf=await crypto.subtle.encrypt({name:'AES-GCM',iv},gvKey,new TextEncoder().encode(value));
  gvCache[name.trim()]={iv:gvB64(iv),data:gvB64(buf)};
  localStorage.setItem('oracle.guest.vault.'+vaultId,JSON.stringify(gvCache));
}
function gvNames(){return Object.keys(gvCache)}
function gvDel(name){delete gvCache[name];localStorage.setItem('oracle.guest.vault.'+vaultId,JSON.stringify(gvCache))}
async function gvGet(name){
  const e=gvCache[name];if(!e||!gvKey)return '';
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:gvUnb64(e.iv)},gvKey,gvUnb64(e.data));
  return new TextDecoder().decode(buf);
}

async function loadDeviceModel(modelId){
  modelId=modelId||DEFAULT_DEVICE_MODEL;
  if(devicePipes[modelId]){devicePipe=devicePipes[modelId];deviceModelId=modelId;return devicePipe}
  if(deviceLoads[modelId])return deviceLoads[modelId];
  deviceStatus='Loading '+(modelId.split('/').pop())+'… (first time only)';render();
  deviceLoads[modelId]=(async()=>{
    try{
      const mod=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.5');
      const opts={dtype:'q4'};
      let pipe;
      try{pipe=await mod.pipeline('text-generation',modelId,{...opts,device:'webgpu'})}
      catch(e){deviceStatus='WebGPU unavailable — using CPU (slower)';render();pipe=await mod.pipeline('text-generation',modelId,{...opts,device:'wasm'})}
      devicePipes[modelId]=pipe;devicePipe=pipe;deviceModelId=modelId;deviceStatus='';render();return pipe;
    }catch(err){deviceStatus='';throw err}
    finally{delete deviceLoads[modelId]}
  })();

}

async function customCloudChat(cm,messages){
  const key=await gvGet('model:'+cm.id);
  const headers={'Content-Type':'application/json'};
  if(key)headers.Authorization='Bearer '+key;
  let r,d;
  try{
    r=await fetch(cm.endpoint,{method:'POST',headers,body:JSON.stringify({
      model:cm.model,
      messages:messages.map(m=>({role:m.from==='user'?'user':'assistant',content:m.text}))
    })});
  }catch(err){throw new Error('Could not reach endpoint — it may block browser requests (CORS).')}
  try{d=await r.json()}catch(e){throw new Error('Endpoint returned non-JSON (HTTP '+r.status+')')}
  if(!r.ok)throw new Error(d.error?.message||('HTTP '+r.status));
  const answer=d.choices?.[0]?.message?.content??d.choices?.[0]?.text??d.response??'';
  if(!answer)throw new Error('No answer in endpoint response');
  return guestFill(String(answer).trim());
}

    recognition=new SR();recognition.lang='en-US';recognition.continuous=false;recognition.interimResults=true;
    recognition.onstart=()=>{listening=true;setCallState('listening')};
    recognition.onresult=e=>{
      let fin='',inter='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const seg=e.results[i];
        if(seg.isFinal)fin+=seg[0].transcript+' ';else inter+=seg[0].transcript;
      }
      if(fin)finalTranscript+=fin;
      const shown=(finalTranscript+inter).trim();
      const inp=document.getElementById('draft');if(inp)inp.value=shown;
      const send=document.getElementById('send');if(send)send.disabled=!shown;
      draft=shown;
    };
    recognition.onerror=e=>{if(e.error==='no-speech')return;if(e.error!=='aborted')showToast('Voice: '+e.error)};
    recognition.onend=()=>{
      listening=false;
      if(!callActive)return;
      const t=finalTranscript.trim();
      if(t){draft=t;sendMessage({preventDefault(){}});return}
      if(!waiting&&callState!=='speaking')setTimeout(()=>{if(callActive)listenLoop()},300);
    };
    recognition.start();
  }catch(err){showToast('Could not start live voice: '+err.message);toggleCall()}
}
function toggleCall(){
  if(callActive){
    callActive=false;listening=false;
    try{recognition?.abort()}catch(e){}
    recognition=null;
    // Restore the speaker setting that was active before the call — ending a
    // call must not leave later chat replies talking out loud.
    voiceReplies=prevVoiceReplies;
    localStorage.setItem('oracle.voiceReplies',voiceReplies?'1':'0');
    cancelSpeech();render();
    showToast(voiceReplies?'Voice call ended — spoken replies still on':'Voice call ended — replies back to text');
    return;
  }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showToast('Live voice needs Chrome or Android Chrome');return}
  prevVoiceReplies=voiceReplies;
  callActive=true;voiceReplies=true;localStorage.setItem('oracle.voiceReplies','1');
  render();showToast('Voice call started — just talk');listenLoop();
}
function afterReply(text){
  waiting=false;credSelected=[];saveState();render();
  if(!text)return;
  if(callActive)speak(text,()=>{if(callActive){setCallState('listening');listenLoop()}});
  else speak(text);
}

async function smartChat(kind,chatId=activeId){
  const c=convs.find(x=>x.id===chatId);if(!c)return;
  if(!c.messages.length){showToast('Ask a question in this room first');return}
  const asks={
    name:'Suggest a short 2-5 word title for this chat. Reply with only the title, no quotes.',
    folder:'Suggest one short folder name where this chat belongs. Reply with only the folder name.',
    summary:'Summarize this chat in two short sentences. Reply with only the summary.',
  };
  const msgs=c.messages.slice(-10).map(m=>({from:m.from,text:m.text}));
  msgs.push({from:'user',text:asks[kind]});
  showToast('Smart action is thinking…');
  try{
    const r=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,backend:'local',credentials:[]})});
    let text=(r.answer||'').trim().replace(/^["']|["']$/g,'').replace(/\s+/g,' ');
    if(r.tool||!text){showToast('The local model could not do that yet');return}
    text=text.split('\n')[0].slice(0,90);
    if(kind==='name'){
      c.name=text;saveState();render();showToast('Room named: '+text);
    }else if(kind==='summary'){
      c.messages.push({from:'bot',text:'Smart summary: '+text,note:'local model'});
      c.preview='Smart summary added';saveState();render();showToast('Summary added to chat');
    }else{
      showSmartFolderModal(chatId,text);
    }
  }catch(err){showToast('Smart action failed: '+err.message)}
}

    el.addEventListener('dragend',()=>{el.classList.remove('dragging');document.querySelectorAll('.drag-over').forEach(n=>n.classList.remove('drag-over'));draggingId=null});
  });
  document.querySelectorAll('[data-drop-folder]').forEach(el=>{
    el.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';el.classList.add('drag-over')});

  });

    if(folder==='__new__'){
      const newName=document.getElementById('rfNew').value.trim();
      if(!newName){showToast('Enter a folder name');return}
      const nf={id:'folder-'+Date.now().toString(36),name:newName,open:true};
      folders.push(nf);folder=nf.id;
    }
    const id='chat-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    convs.push({id,name,preview:'Ask me anything…',hero:heroId,folder,messages:[]});
    const f=folders.find(x=>x.id===folder);if(f){f.open=true;activeFolder=f.id}
    activeId=id;modal=null;saveState();render();showToast('Room created: '+name);
  });
  document.getElementById('folderForm')?.addEventListener('submit',e=>{
    e.preventDefault();
    const id=document.getElementById('foId').value.trim(),name=document.getElementById('fn').value.trim();
    if(!name)return;
    const f=id?folders.find(x=>x.id===id):null;
    if(f)f.name=name;else folders.push({id:'folder-'+Date.now().toString(36),name,open:true});
    modal=null;saveState();render();showToast(f?'Folder renamed':'Folder created: '+name);
  });
  document.getElementById('renameForm')?.addEventListener('submit',e=>{
    e.preventDefault();
    const kind=document.getElementById('reKind').value,id=document.getElementById('reId').value,name=document.getElementById('rv').value.trim();
    const item=kind==='chat'?convs.find(x=>x.id===id):folders.find(x=>x.id===id);
    if(item&&name){item.name=name;saveState();showToast('Renamed to '+name)}
    modal=null;render();
  });
  document.querySelectorAll('[data-fm]').forEach(b=>b.onclick=()=>{
    const act=b.dataset.fm,id=b.dataset.id;modal=null;
    if(act==='rename')openRenameModal('folder',id);
    if(act==='new')openRoomModal(id);
    if(act==='share')makeFamilyFolderLink(id);
    if(act==='delete'){
      const f=folders.find(x=>x.id===id);
      if(folders.length===1){render();showToast('Keep at least one folder');return}
      const target=folders.find(x=>x.id!==id);
      convs.filter(x=>x.folder===id).forEach(x=>{x.folder=target.id});
      folders=folders.filter(x=>x.id!==id);
      if(activeFolder===id)activeFolder=target.id;
      saveState();render();showToast('Folder removed; its chats were kept');
    }
  });
  document.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>{
    const act=b.dataset.cm,id=b.dataset.id;modal=null;
    if(act==='rename')openRenameModal('chat',id);
    if(act==='move')openMoveModal(id);
    if(act.startsWith('smart-'))smartChat(act.slice(6),id);
    if(act==='share'){activeId=id;openShareModal()}
    if(act==='delete')openDeleteChatModal(id);
  });
  document.querySelectorAll('[data-move-chat]').forEach(b=>b.onclick=()=>{modal=null;moveChat(b.dataset.moveChat,b.dataset.moveFolder)});
  document.querySelectorAll('[data-smart-use]').forEach(b=>b.onclick=()=>{modal=null;moveChat(b.dataset.smartChat,b.dataset.smartUse)});
  document.getElementById('smartCreate')?.addEventListener('click',e=>{
    const name=e.currentTarget.dataset.smartName,chatId=e.currentTarget.dataset.smartChat;
    let f=folders.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!f){f={id:'folder-'+Date.now().toString(36),name,open:true};folders.push(f)}
    modal=null;moveChat(chatId,f.id);
  });
  document.getElementById('confirmDeleteChat')?.addEventListener('click',e=>{
    const id=e.currentTarget.dataset.id,idx=convs.findIndex(x=>x.id===id);
    if(idx>=0&&convs.length>1){
      convs.splice(idx,1);
      if(activeId===id)activeId=convs[0].id;
      activeFolder=convs[0].folder;saveState();showToast('Chat deleted');
    }
    modal=null;render();
  });
  document.getElementById('shareCopy')?.addEventListener('click',async()=>{
    const t=document.getElementById('shareText');t.select();
    try{await navigator.clipboard.writeText(t.value)}catch(err){document.execCommand('copy')}
    showToast('Transcript copied');
  });
  document.getElementById('shareDownload')?.addEventListener('click',()=>{
    const t=document.getElementById('shareText'),blob=new Blob([t.value],{type:'text/plain'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=(active().name||'oracle-chat').replace(/[^a-z0-9_-]+/gi,'-')+'.txt';
    document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);showToast('Transcript downloaded');
  });
  function makeFamilyLink(includeChat){
    const c=active();
    const payload=includeChat?{chat:{id:c.id,name:c.name,hero:c.hero,messages:c.messages}}:{own:true};
    openLinkModal(staticShareLink(payload),includeChat?'Family link with this chat':'Family link');
  }
  document.getElementById('shareFamilyOwn')?.addEventListener('click',()=>makeFamilyLink(false));
  document.getElementById('shareFamilyChat')?.addEventListener('click',()=>makeFamilyLink(true));
  document.getElementById('copyShareLink')?.addEventListener('click',async()=>{
    const t=document.getElementById('shareLinkText');t.select();
    try{await navigator.clipboard.writeText(t.value)}catch(err){document.execCommand('copy')}
    showToast('Share link copied');
  });
  document.getElementById('guestStart')?.addEventListener('click',()=>guestChoose('own'));
  document.getElementById('guestContinue')?.addEventListener('click',()=>guestChoose('chat'));
  document.getElementById('guestFolder')?.addEventListener('click',()=>guestChoose('folder'));
  document.getElementById('guestChooseDone')?.addEventListener('click',()=>guestChoose('own'));
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{if(!credSelected.includes(b.dataset.pick))credSelected.push(b.dataset.pick);modal=null;render();showToast('Selected '+b.dataset.pick+' (value hidden)')});
  document.getElementById('credForm')?.addEventListener('submit',async e=>{
    e.preventDefault();const key=document.getElementById('ck').value.trim(),value=document.getElementById('cv').value;
    const r=await api('/api/vault/set',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,value})});
    modal=null;if(r.ok){showToast('Saved to Keychain: '+key)}else{showToast('Could not save: '+(r.error||'unknown'))}
    vaultKeys=(await api('/api/vault/list')).keys;render();
  });
  document.getElementById('nameForm')?.addEventListener('submit',e=>{
    e.preventDefault();const v=document.getElementById('dn').value.trim();
    if(v){displayName=v;localStorage.setItem('oracle.displayName',v)}
    modal=null;render();if(v)showToast('Name updated: '+v);
  });
  document.getElementById('skillForm')?.addEventListener('submit',async e=>{
    e.preventDefault();const name=document.getElementById('sk').value.trim(),desc=document.getElementById('sd').value.trim();
    await api('/api/skills',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,desc})});
    modal=null;render();showToast('Skill saved: '+name);
  });
}

function noteOf(r){return [r.backend&&'backend: '+r.backend,r.note].filter(Boolean).join(' · ')}

async function toolAction(idx,approved){
  const c=active(), m=c.messages[idx];
  if(!m||!(m.toolState==='pending'||m.toolState==='working'))return;
  m.toolState='working';waiting=true;render();
  let result=null;
  if(approved){
    try{result=await api('/api/tool/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tool:m.tool,approved:true})})}
    catch(err){result={ok:false,error:err.message}}
    m.toolResult=result;m.toolState=result.ok?'done':'error';
  }else{
    m.toolResult={ok:false,error:'Denied by you.'};m.toolState='denied';
  }
  render();await followUp(idx,result);
}

async function followUp(idx,result){
  const c=active(),m=c.messages[idx];
  const prior=c.messages.slice(0,idx).map(x=>({from:x.from,text:x.text}));
  const body={messages:prior,backend,credentials:credSelected};
  if(m.toolState==='denied')body.toolDenied=true;
  if(result)body.toolResult=result;
  try{
    const r=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    c.messages.push({from:'bot',text:r.answer||'(no answer)',note:noteOf(r)});
    c.preview=(r.answer||'').slice(0,40);
  }catch(err){c.messages.push({from:'bot',text:'Bridge error: '+err.message,note:'Start the bridge from the Desktop launcher.'})}
  afterReply(c.messages.at(-1)?.text||'');
}

async function sendMessage(e){
  e.preventDefault();
  const text=draft.trim();if(!text&&!files.length)return;
  const extra=(files.length?'\n[Attached files: '+files.join(', ')+']':'');
  const c=active();
  c.messages.push({from:'user',text:text+extra});c.preview=(text||'file')+'…';
  draft='';files=[];waiting=true;if(callActive)setCallState('thinking');render();
  let replyText='',delegated=false;
  const cm=customModels.find(m=>m.id===backend);
  try{
    const msgs=c.messages.map(m=>({from:m.from,text:m.text}));
    if(credSelected.length)msgs.push({from:'user',text:'[Saved credentials available by name only: '+credSelected.join(', ')+'. Never ask for their values.]'});
    if(backend==='device'||backend==='device-small'||(cm&&cm.type==='device')){
      const answer=await deviceChat(msgs,backend==='device-small'?SMALL_DEVICE_MODEL:cm?.model);
      c.messages.push({from:'bot',text:answer,note:(cm?cm.name:'On-device')+' · private'});
      c.preview=answer.slice(0,40);replyText=answer;
    }else if(cm&&cm.type==='cloud'){
      const answer=await customCloudChat(cm,msgs);
      c.messages.push({from:'bot',text:answer,note:cm.name+' · your provider'});
      c.preview=answer.slice(0,40);replyText=answer;
    }else{
      const r=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,backend,credentials:credSelected})});
      if(r.tool){
        const m={from:'bot',text:r.answer||'',note:noteOf(r),tool:r.tool,toolSummary:r.toolSummary,
                 needsApproval:r.needsApproval,toolState:r.needsApproval?'pending':'working'};
        c.messages.push(m);replyText=r.answer||'';
        render();
        if(!r.needsApproval){delegated=true;await toolAction(c.messages.indexOf(m),true)}
      }else{
        c.messages.push({from:'bot',text:r.answer||'(no answer)',note:noteOf(r)});
        c.preview=(r.answer||'').slice(0,40);replyText=r.answer||'';
      }
    }
  }catch(err){
    const own=backend==='device'||backend==='device-small'||!!cm;
    c.messages.push({from:'bot',text:(own?'Model error: ':'Bridge error: ')+err.message,
      note:own?(cm?.type==='cloud'?'Check the endpoint and key':'Try another model'):'Start the bridge from the Desktop launcher.'});
    replyText='';
  }
  if(!delegated){const last=c.messages.at(-1)?.text||replyText;afterReply(last)}
}
(async()=>{
  await gvInit();
  if(guestMode&&!staticMode){
    try{guestInfo=await api('/api/share/open')}catch(err){showToast('This share link is not valid.');guestInfo=null}
    if(!guestInfo){showToast('This share link is not valid.');guestInfo=null}
  }
  await refresh();
  if(guestMode)openGuestWelcome(guestInfo||{});
})();
