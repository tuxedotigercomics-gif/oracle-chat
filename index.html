<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#4a9861" />
<meta name="oracle-build" content="2026-11-21g" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Oracle" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<title>Oracle · Chat (Live)</title>
<script>
  // Set the theme before styles paint so a dark-mode reload has no light flash.
  (function(){
    try{
      var pref=localStorage.getItem('oracle.theme')||'system';
      var dark=pref==='dark'||(pref==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme=dark?'dark':'light';
    }catch(e){document.documentElement.dataset.theme='light'}
  })();
</script>
<style>
  :root{
    color-scheme:light;
    --sidebar-bg:#f7f8f7; --sidebar-active:#e8f3eb; --sidebar-hover:#eef1ee;
    --main-bg:#f3f5f3; --surface:#fff; --surface-2:#f8faf8; --surface-3:#eceff0;
    --border:#e3e8e4; --border-strong:#d2dad4;
    --text:#17201b; --muted:#68756d; --faint:#98a49c;
    --accent:#3f8f5b; --accent-2:#2f7d47; --accent-soft:#e8f5ec; --accent-contrast:#fff;
    --danger:#c0392b; --danger-soft:#fdeceb; --danger-contrast:#fff;
    --ok:#2f7d47; --ok-soft:#e8f5ec;
    --warn:#8a6300; --warn-soft:#fff5db;
    --info:#4a4ab0; --info-soft:#eef0ff;
    --shadow:0 1px 2px rgba(18,38,26,.05),0 8px 24px rgba(18,38,26,.06);
    --shadow-lg:0 18px 50px rgba(14,28,20,.18);
    --radius-lg:18px; --radius-md:12px; --radius-sm:9px;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --sidebar-bg:#111613; --sidebar-active:#1d2b22; --sidebar-hover:#1a211c;
    --main-bg:#0d110f; --surface:#151b17; --surface-2:#1a211c; --surface-3:#232c25;
    --border:#2a342d; --border-strong:#38463c;
    --text:#eef4ef; --muted:#a2b0a6; --faint:#75857a;
    --accent:#61b97d; --accent-2:#4ca76a; --accent-soft:#1b3324; --accent-contrast:#08130c;
    --danger:#ff7a6b; --danger-soft:#3a1e1b; --danger-contrast:#1a0b09;
    --ok:#61b97d; --ok-soft:#1b3324;
    --warn:#f0c766; --warn-soft:#3a3018;
    --info:#9aa2ff; --info-soft:#232547;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.28);
    --shadow-lg:0 18px 50px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--main-bg);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  button,input,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .app{display:flex;height:100vh;height:100dvh;width:100%;overflow:hidden}
  @supports(padding:env(safe-area-inset-top)){.app{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}}

  .sidebar{width:20%;min-width:230px;max-width:320px;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column}
  .sidebar-top{display:flex;align-items:center;justify-content:space-between;padding:16px 14px 10px}
  .workspace{display:flex;align-items:center;gap:4px;min-width:0}
  .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 0 0 3px var(--accent-soft);flex-shrink:0}
  .workspace-name{font-weight:700;font-size:15px;letter-spacing:-.02em}
  .workspace-sub{color:var(--muted);font-size:11px;background:var(--surface-3);border-radius:999px;padding:2px 7px}
  .icon-btn{background:transparent;border:none;border-radius:10px;padding:6px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;transition:background-color .16s,color .16s}
  .icon-btn:hover{background:var(--sidebar-hover);color:var(--text)}
  .icon-btn.active{background:var(--accent-soft);color:var(--accent-2)}
  .icon-btn.listening,.icon-btn.calling{background:var(--danger-soft);color:var(--danger);animation:agent-wave .6s ease-in-out infinite alternate}
  .call-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--ok-soft);border-top:1px solid var(--border);font-size:12px;color:var(--ok);font-weight:600}
  .call-dot{width:9px;height:9px;border-radius:50%;background:currentColor;animation:agent-wave .6s ease-in-out infinite alternate}
  .call-bar.thinking{background:var(--warn-soft);color:var(--warn)}
  .call-bar.speaking{background:var(--info-soft);color:var(--info)}
  .call-bar button{margin-left:auto;border:0;background:var(--danger);color:var(--danger-contrast);border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer}
  .progress-track{height:5px;background:var(--surface-3);border-radius:999px;overflow:hidden;margin-top:7px;box-shadow:inset 0 0 0 1px var(--border)}
  .progress-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .25s ease;animation:progress-pulse 1.2s ease-in-out infinite alternate}
  @keyframes progress-pulse{from{opacity:.72}to{opacity:1}}
  .section-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:10px 14px 5px;font-weight:750;display:flex;align-items:center;justify-content:space-between}
  .mini-add{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;border-radius:7px;padding:3px 6px}
  .mini-add:hover{background:var(--sidebar-hover);color:var(--text)}
  .view-tabs{gap:5px;align-items:center;padding-right:10px}
  .view-tabs>button[data-list-view]{background:transparent;border:none;border-radius:8px;padding:4px 8px;font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);cursor:pointer}
  .view-tabs>button[data-list-view]:hover{background:var(--sidebar-hover)}
  .view-tabs>button[data-list-view].active{background:var(--sidebar-active);color:var(--accent-2)}
  .view-tabs .mini-add{margin-left:auto}
  .drop-chips{display:flex;flex-wrap:wrap;gap:5px;padding:5px 10px 9px}
  .drop-chip{background:var(--surface);border:1px dashed var(--border-strong);border-radius:999px;padding:4px 10px;font-size:11px;color:var(--muted);cursor:pointer}
  .drop-chip:hover{border-color:var(--accent);color:var(--text)}
  .drop-chip.drag-over{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2)}
  .folder-head.drag-over{outline:2px dashed var(--accent);background:var(--accent-soft)}
  .conv-wrap.dragging{opacity:.45}
  .nav-item{display:flex;align-items:center;gap:9px;width:calc(100% - 16px);margin:0 8px 2px;text-align:left;background:transparent;border:none;border-radius:10px;padding:9px 10px;font-size:13.5px;cursor:pointer}
  .nav-item:hover{background:var(--sidebar-hover)}
  .nav-item.active{background:var(--sidebar-active);color:var(--accent-2);font-weight:650}
  .folder-list{flex:1;overflow-y:auto;padding:4px 8px}
  .folder-head{display:flex;align-items:center;border-radius:10px}
  .folder-head:hover{background:var(--sidebar-hover)}
  .folder-head.current{background:var(--sidebar-active)}
  .folder-row{display:flex;align-items:center;gap:6px;flex:1;min-width:0;text-align:left;background:transparent;border:none;border-radius:9px;padding:8px 2px 8px 7px;font-size:13.5px;font-weight:650;cursor:pointer;color:var(--text)}
  .folder-caret{width:12px;color:var(--muted);font-size:11px}
  .folder-glyph{font-size:13px}
  .folder-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .folder-count{font-size:11px;color:var(--muted);font-weight:500;background:var(--surface-3);border-radius:999px;padding:1px 6px}
  .row-action{background:transparent;border:none;color:var(--muted);cursor:pointer;border-radius:7px;padding:3px 6px;font-size:13px;line-height:1}
  .row-action:hover{background:var(--surface-3);color:var(--text)}
  .folder-chats{padding:1px 0 5px 18px}
  .conv-list{flex:1;overflow-y:auto;padding:4px 8px}
  .conv-wrap{display:flex;align-items:center;border-radius:11px}
  .conv-wrap:hover{background:var(--sidebar-hover)}
  .conv-wrap.active{background:var(--sidebar-active);box-shadow:inset 3px 0 var(--hero,var(--accent))}
  .conv{display:flex;align-items:center;gap:8px;flex:1;min-width:0;text-align:left;background:transparent;border:none;border-radius:11px;padding:8px 3px 8px 8px;margin-bottom:2px;cursor:pointer}
  .conv:hover{background:var(--sidebar-hover)}
  .conv.active{background:var(--sidebar-active)}
  .conv-body{display:flex;flex-direction:column;align-items:flex-start;min-width:0;flex:1}
  .conv-name{font-size:13.5px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .conv-preview{font-size:12.5px;color:var(--muted);line-height:1.3;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .empty-folder{font-size:12px;color:var(--muted);padding:5px 10px 7px}
  .new-in-folder{background:transparent;border:none;color:var(--muted);font-size:11.5px;cursor:pointer;padding:5px 10px 7px;border-radius:8px}
  .new-in-folder:hover{background:var(--sidebar-hover);color:var(--text)}
  .agent-avatar{position:relative;width:26px;height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--surface-3);border:1px solid var(--hero,var(--border));border-radius:8px}
  .agent-avatar svg{width:24px;height:24px}
  .agent-avatar.walking{animation:agent-walk 1.1s ease-in-out infinite}
  .agent-avatar.asking::after{content:"";position:absolute;right:-3px;top:-4px;width:6px;height:10px;background:var(--warn);border:1px solid var(--warn);transform-origin:bottom center;animation:agent-wave .7s ease-in-out infinite alternate}
  @keyframes agent-walk{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-3px) rotate(2deg)}}
  @keyframes agent-wave{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
  .profile{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:none;border-top:1px solid var(--border);background:transparent;text-align:left;cursor:pointer;font:inherit;color:inherit}
  .profile:hover,.profile.open{background:var(--sidebar-hover)}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:750;flex-shrink:0}
  .profile-info{display:flex;flex-direction:column;min-width:0}
  .profile-name{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .profile-sub{font-size:11.5px;color:var(--muted)}
  .profile-caret{margin-left:auto;color:var(--muted);font-size:14px;line-height:1}
  .dropdown.profile-menu{bottom:60px;left:8px;min-width:230px}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--main-bg)}
  .chat-header{height:60px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:relative;z-index:45}
  .chat-title-name{font-size:15px;font-weight:680;min-width:0;overflow:hidden}
  .chat-name-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .model-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .header-actions{display:flex;align-items:center;gap:8px}
  .model-pill{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:7px 11px;font-size:12.5px;font-weight:600;cursor:pointer;transition:background-color .16s,border-color .16s}
  .model-pill:hover{background:var(--surface-3);border-color:var(--border-strong)}
  .model-pill .caret{color:var(--muted);font-size:10px}
  .share-btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .share-btn:hover{background:var(--surface-3)}
  .status-dot{font-size:11px;font-weight:650;padding:4px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
  .status-dot.off{background:var(--danger-soft);color:var(--danger)}
  .messages{flex:1;overflow-y:auto;padding:26px 20px}
  .messages-inner{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  .row{display:flex}
  .row.user{justify-content:flex-start}
  .row.bot{justify-content:flex-end}
  .bubble{max-width:78%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;box-shadow:var(--shadow)}
  .bubble.user{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:5px}
  .bubble.bot{background:var(--hero,var(--accent));color:#fff;border-bottom-right-radius:5px}
  .bubble-retry{display:inline-block;margin-top:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:10px;padding:4px 9px;font-size:11.5px;cursor:pointer}
  .bubble-retry:hover{background:rgba(255,255,255,.26)}
  .chat-image{display:block;max-width:100%;max-height:360px;border-radius:12px;border:1px solid var(--border);margin:8px 0}
  .img-actions{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
  .img-actions .btn{padding:4px 9px;font-size:11.5px}
  .img-size-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:6px;margin:10px 0}
  .img-size-grid button{padding:8px 4px;font-size:11.5px}
  .img-preview{display:flex;justify-content:center;margin-top:12px}
  .img-preview img{max-width:100%;max-height:300px;border-radius:12px;border:1px solid var(--border)}
  .meta{font-size:11px;color:var(--muted);margin-top:5px;font-style:italic}
  .web-sources{display:flex;flex-direction:column;gap:2px;margin-top:6px;font-size:11px}
  .web-sources a{color:var(--accent-2);text-decoration:none;overflow-wrap:anywhere}
  .web-sources a:hover{text-decoration:underline}
  .status{font-size:12.5px;color:var(--muted);font-style:italic;align-self:flex-start;padding-left:2px}
  .composer-wrap{flex-shrink:0;width:calc(100% - 40px);max-width:780px;margin:0 auto 18px}
  .attach-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-3);border-radius:8px;padding:5px 9px;font-size:12px}
  .chip button{background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;line-height:1;padding:0}
  .composer{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);display:flex;align-items:center;gap:8px;padding:9px 10px;box-shadow:var(--shadow);position:relative;transition:border-color .16s,box-shadow .16s}
  .composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
  .composer-plus{background:transparent;border:none;border-radius:10px;padding:7px;cursor:pointer;color:var(--muted);display:flex;transition:background-color .16s,color .16s}
  .composer-plus:hover,.composer-plus.open{background:var(--surface-3);color:var(--text)}
  .composer input{flex:1;border:none;outline:none;background:transparent;font-size:14px;padding:6px 4px}
  .composer input::placeholder{color:var(--faint)}
  .composer-send{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-contrast);border:none;border-radius:12px;width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(63,143,91,.24)}
  .composer-send:disabled{background:var(--surface-3);color:var(--faint);box-shadow:none;cursor:default}

  .backdrop{position:fixed;inset:0;z-index:40}
  .dropdown{position:absolute;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);padding:7px;min-width:200px}
  .dropdown.model{top:50px;right:20px}
  .dropdown.more{top:50px;right:88px;min-width:225px}
  .dropdown.plus{bottom:56px;left:10px}
  .menu-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;border-radius:10px;padding:10px;font-size:13.5px;cursor:pointer;color:var(--text)}
  .menu-item:hover{background:var(--surface-2)}
  .menu-item .mi-sub{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
  .mi-note{font-size:11px;color:var(--muted);line-height:1.45;padding:5px 10px 8px}
  .model-remove{margin-left:auto;color:var(--muted);font-size:12px;padding:3px 5px;border-radius:6px;cursor:pointer}
  .model-remove:hover{background:var(--danger-soft);color:var(--danger)}
  .menu-sep{height:1px;background:var(--border);margin:6px 4px}
  .modal-backdrop{position:fixed;inset:0;background:rgba(8,14,10,.48);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:60}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;width:min(440px,92vw);max-height:86vh;overflow:auto;box-shadow:var(--shadow-lg)}
  .modal h3{margin:0 0 5px;font-size:18px;letter-spacing:-.02em}
  .modal p{margin:0 0 14px;font-size:13px;color:var(--muted);line-height:1.5}
  .modal label{display:block;font-size:12.5px;font-weight:650;margin:12px 0 5px}
  .modal input,.modal textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 11px;font-size:13.5px;outline:none;resize:vertical;background:var(--surface-2)}
  .modal input:focus,.modal textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .modal select{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 11px;font-size:13.5px;outline:none;background:var(--surface-2);color:var(--text)}
  .modal select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .persona-list{display:grid;gap:6px;max-height:50vh;overflow:auto}
  .persona-opt.selected{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  .about-grid{display:grid;gap:8px;margin-top:14px}
  .about-row{display:flex;justify-content:space-between;gap:14px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);font-size:12.5px}
  .about-row span:first-child{color:var(--muted)}
  .about-row span:last-child{text-align:right;font-weight:600;overflow-wrap:anywhere}
  .camera-stage{position:relative;width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#0b0f0d;border:1px solid var(--border)}
  .camera-stage video,.camera-stage canvas{width:100%;height:100%;object-fit:cover;display:block}
  .camera-stage video{transform:scaleX(-1)}
  .camera-note{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:9px}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .btn{border:1px solid var(--border);background:var(--surface-2);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer}
  .btn:hover{background:var(--surface-3)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-contrast);border-color:transparent}
  .btn.danger{background:var(--danger);color:var(--danger-contrast);border-color:transparent}
  .vault-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;margin-bottom:6px;font-size:13px}
  .vault-row code{font-size:12px;color:var(--muted)}
  .tool-card{margin-top:9px;border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:10px 11px;max-width:420px;box-shadow:var(--shadow)}
  .tool-title{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--accent-2)}
  .tool-preview{margin:7px 0 0;max-height:110px;overflow:auto;background:var(--surface-2);border-radius:8px;padding:7px 9px;font-size:11px;white-space:pre-wrap;word-break:break-word;color:var(--text)}
  .tool-actions{display:flex;gap:8px;margin-top:9px}
  .tool-actions .btn{padding:6px 11px;font-size:12px}
  .hero-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:220px;overflow:auto;margin-top:8px}
  .hero-choice{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:7px 2px;cursor:pointer;font-size:10px;color:var(--muted)}
  .hero-choice:hover{background:var(--surface-2)}

function heroAvatar(id,state=''){
  const h=hero(id), rows=SPRITES[h.sprite]||SPRITES.mask;

const staticMode=!['127.0.0.1','localhost','[::1]'].includes(location.hostname);
let pendingDraft='';
// Keep the hosted app and its downloaded model available without a connection.
// Installed Home Screen apps resume instead of navigating, so they have to ask
// for a new build themselves rather than wait for iOS to relaunch them.
if(staticMode && 'serviceWorker' in navigator && location.protocol.startsWith('http')){
  (function autoUpdate(){
    const meta=document.querySelector('meta[name="oracle-build"]');
    const BUILD=meta?meta.content:'';
    const DRAFT='oracle.pendingDraft', COUNT='oracle.reload.count';
    let checking=0, newWorker=null, watching=false, reloading=false;
    let lastResult='Not checked yet', lastChecked=0;
    // The About screen uses these; no host data or chat content is exposed.
    window.oracleUpdateInfo=()=>({build:BUILD,result:lastResult,checked:lastChecked,
      controller:!!navigator.serviceWorker.controller,waiting:!!newWorker,
      reloads:+(sessionStorage.getItem(COUNT)||0)});
    window.oracleCheckUpdate=async()=>{checking=0;await check();return window.oracleUpdateInfo()};

    let updateReloadTimer=null;
    function updateBusy(){
      // Never yank the page away while an image is generating or a chat reply
      // is pending. On a phone that showed as a white flash and a lost result.
      try{return !!(imageBusy||waiting)}catch(e){return false}
    }
    function reloadOnce(){
      if(reloading)return;
      if(updateBusy()){
        if(!updateReloadTimer)updateReloadTimer=setTimeout(()=>{updateReloadTimer=null;reloadOnce()},5000);
        return;
      }
      if(updateReloadTimer){clearTimeout(updateReloadTimer);updateReloadTimer=null}
      let n=0;
      try{n=+(sessionStorage.getItem(COUNT)||0)}catch(e){}
      if(n>=2)return;
      try{
        sessionStorage.setItem(COUNT,String(n+1));
        sessionStorage.setItem(DRAFT,draft||'');
      }catch(e){}
      reloading=true;
      location.reload();
    }

    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(newWorker){newWorker=null;reloadOnce()}
    });

    async function check(){
      const now=Date.now();
      if(now-checking<15000)return;
      checking=now;lastChecked=now;
      // The build marker lives in index.html itself, so an HTML-only change is
      // detected without keeping a separate version file in sync.
      if(BUILD){
        try{
          const url=new URL('index.html',location.href);
          url.search='?v='+now;
          const res=await fetch(url,{cache:'no-store',headers:{Range:'bytes=0-8191'}});
          const head=await res.text();
          const m=head.match(/<meta name="oracle-build" content="([^"]+)">/);
          if(m&&m[1]!==BUILD){lastResult='New build found — reloading';reloadOnce();return}
        }catch(e){lastResult='Could not reach the site — trying the service worker'}
      }
      try{
        const reg=await navigator.serviceWorker.register(new URL('sw.js',location.href));
        try{await reg.update()}catch(e){}
        const takeOver=w=>{
          if(!navigator.serviceWorker.controller)return;
          newWorker=w;
          try{w.postMessage({type:'SKIP_WAITING'})}catch(e){}
        };
        if(reg.waiting)takeOver(reg.waiting);
        if(!watching){
          watching=true;
          reg.addEventListener('updatefound',()=>{
            const nw=reg.installing;
            if(!nw)return;
            nw.addEventListener('statechange',()=>{
              if((nw.state==='installed'||nw.state==='activating'||nw.state==='activated')&&navigator.serviceWorker.controller)takeOver(nw);
            });
          });
        }
        if(!lastResult.startsWith('Could not reach'))lastResult=newWorker?'New worker taking over':'Up to date';
      }catch(e){lastResult='Service worker unavailable'}
    }

    window.addEventListener('load',check);
    window.addEventListener('pageshow',check);
    window.addEventListener('focus',check);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
    try{
      pendingDraft=sessionStorage.getItem(DRAFT)||'';
      if(pendingDraft)sessionStorage.removeItem(DRAFT);
    }catch(e){}
  })();
}
// On a hosted build, share links use whatever host served the page (GitHub Pages
// or oracle-chat.pages.dev). On the Mac, use the neutral public site so family
// never see the account name in a shared link.
const PUBLIC_SHARE_BASE='https://oracle-chat.pages.dev/';
const PAGES_BASE=staticMode
  ? location.origin+location.pathname.replace(/\/[^/]*$/,'/')
  : PUBLIC_SHARE_BASE;
const b64enc=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

let hashShare=null;
if(hashParams.get('s')){try{hashShare=JSON.parse(b64dec(hashParams.get('s')))}catch(e){}}
const shareToken=queryParams.get('share')||(hashShare&&hashShare.id)||hashParams.get('s')||'';

function staticShareLink(payload){
  payload.id=payload.id||('g'+Math.random().toString(36).slice(2,10));
  return PAGES_BASE+'#s='+b64enc(JSON.stringify(payload));
}

  folders=[{id:'general',name:'My Chats',open:true}];

  if(saved&&Array.isArray(saved.convs)&&Array.isArray(saved.folders)&&saved.convs.length&&saved.folders.length){
    folders=saved.folders;

// Guest/device vault: secrets stay encrypted in this device's browser, never sent to a model.
let gvKey=null, gvCache={};
const vaultId=shareToken||'self';
const gvB64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const gvUnb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function gvInit(){
  if(!('crypto' in window&&crypto.subtle))return;
  const kk='oracle.guest.vaultkey.'+vaultId;
  let raw=localStorage.getItem(kk);
  if(raw)gvKey=await crypto.subtle.importKey('raw',gvUnb64(raw),'AES-GCM',false,['encrypt','decrypt']);
  else{const r=crypto.getRandomValues(new Uint8Array(32));gvKey=await crypto.subtle.importKey('raw',r,'AES-GCM',false,['encrypt','decrypt']);localStorage.setItem(kk,gvB64(r))}
  const v=localStorage.getItem('oracle.guest.vault.'+vaultId);
  if(v){try{gvCache=JSON.parse(v)}catch(e){gvCache={}}}
}
async function gvSet(name,value){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const buf=await crypto.subtle.encrypt({name:'AES-GCM',iv},gvKey,new TextEncoder().encode(value));
  gvCache[name.trim()]={iv:gvB64(iv),data:gvB64(buf)};
  localStorage.setItem('oracle.guest.vault.'+vaultId,JSON.stringify(gvCache));
}
function gvNames(){return Object.keys(gvCache)}
function gvDel(name){delete gvCache[name];localStorage.setItem('oracle.guest.vault.'+vaultId,JSON.stringify(gvCache))}
async function gvGet(name){
  const e=gvCache[name];if(!e||!gvKey)return '';
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:gvUnb64(e.iv)},gvKey,gvUnb64(e.data));
  return new TextDecoder().decode(buf);
}
function guestFill(text){return String(text).replace(/\[\[USE:([^|\]]+)\|([^\]]+)\]\]/g,(m,n)=>`[credential '${n}' — value stayed on this device]`)}

// ---- Host-only approval rules ----

let toolRules=[];
try{const x=JSON.parse(localStorage.getItem(TR_KEY)||'[]');if(Array.isArray(x))toolRules=x.filter(s=>typeof s==='string').slice(0,100)}catch(e){}
function saveToolRules(){try{localStorage.setItem(TR_KEY,JSON.stringify(toolRules))}catch(e){}}
function canonicalValue(v){
  if(Array.isArray(v))return '['+v.map(canonicalValue).join(',')+']';
  if(v&&typeof v==='object')return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canonicalValue(v[k])).join(',')+'}';
  const s=JSON.stringify(v);return s===undefined?'null':s;
}
function toolKey(tool){const s=canonicalValue(tool);return s&&s.length<=6000?s:''}
function toolRisk(tool){
  const t=String((tool&&tool.tool)||'').toLowerCase(),act=String((tool&&tool.action)||'').toLowerCase(),out=[];
  if(t==='shell')out.push('runs a command on your Mac');
  else if(t==='write'||t==='patch')out.push('changes a file');
  else if(['fetch','email','webhook','browser'].includes(t))out.push('sends data outside this app');
  else if(t==='memory'&&act==='save')out.push('changes saved memory');
  else if(['vault','skills','routines'].includes(t))out.push('changes private settings');
  else out.push('uses a host tool');
  if(['shell','write','patch','email','webhook','browser'].includes(t))out.push('review the target carefully');
  return out.slice(0,2);
}
function toolAutoAllowed(tool){const k=toolKey(tool);return !!k&&!guestMode&&!staticMode&&toolRules.includes(k)}

// ---- Device-local routines (static/phone build only) ----
// The on-device model can DRAFT a routine, but nothing executes until the owner
// approves it. Steps are a strict whitelist: model output is never eval'd, and
// a routine can only call hosts the owner typed into the allowlist.
const DR_KEY='oracle.routines.'+vaultId;
const DR_OPS=['fetch','model','say','notify','share','wait','log'];
let deviceRoutines={routines:{},allowHosts:[],lastRun:{},history:{}},drRunning=false,drEditorId=null,drEditorText='',drOutput='';
function drLoad(){
  try{
    const x=JSON.parse(localStorage.getItem(DR_KEY)||'{}');
    deviceRoutines={
      routines:(x.routines&&typeof x.routines==='object')?x.routines:{},
      allowHosts:Array.isArray(x.allowHosts)?x.allowHosts:[],
      lastRun:(x.lastRun&&typeof x.lastRun==='object')?x.lastRun:{},
      history:(x.history&&typeof x.history==='object')?x.history:{}
    };
  }catch(e){deviceRoutines={routines:{},allowHosts:[],lastRun:{},history:{}}}
}
function drSave(){try{localStorage.setItem(DR_KEY,JSON.stringify(deviceRoutines))}catch(e){}}
function drAllowed(url){
  try{
    const u=new URL(String(url||''));
    if(!/^https?:$/.test(u.protocol)||!deviceRoutines.allowHosts.length)return false;
    return deviceRoutines.allowHosts.some(h=>h&&(u.hostname===h||u.hostname.endsWith('.'+h)));
  }catch(e){return false}
}
function drValidate(r){
  if(!r||typeof r!=='object'||typeof r.name!=='string'||!r.name.trim())return {error:'Give the routine a name.'};
  const steps=Array.isArray(r.steps)?r.steps:[];
  if(!steps.length||steps.length>12)return {error:'Use between 1 and 12 steps.'};
  for(const s of steps){
    if(!s||!DR_OPS.includes(s.op))return {error:'Unsupported step: '+String(s&&s.op||'(none)')};
    if(s.op==='fetch'&&!drAllowed(s.url))return {error:'Host not allowed: '+String(s.url||'').split('/')[2]+'. Add it to Allowed endpoints first.'};
    if(s.op==='wait')s.ms=Math.max(100,Math.min(Number(s.ms)||1000,5000));
  }
  const t=r.trigger&&typeof r.trigger==='object'?r.trigger:{type:'manual'};
  return {routine:{
    id:r.id||('r-'+Date.now().toString(36)),name:r.name.trim().slice(0,60),
    steps:steps.map(s=>({op:s.op,url:s.url,method:s.method==='POST'?'POST':'GET',body:s.body,
      prompt:s.prompt,text:s.text,title:s.title,saveAs:s.saveAs,ms:s.ms})),
    trigger:{type:['manual','interval','at'].includes(t.type)?t.type:'manual',
      minutes:Math.max(5,Math.min(Number(t.minutes)||60,10080)),
      time:/^\d{1,2}:\d{2}$/.test(t.time||'')?t.time:'08:00'},
    // Never trust a newly authored/edited routine. The owner must approve it.
    trusted:false,created:Date.now()
  }};
}
async function drResolve(text,vars,secrets){
  let out=String(text==null?'':text);
  for(const m of out.matchAll(/\{\{cred:([^}]+)\}\}/g)){
    const v=await gvGet(m[1].trim());
    if(v)secrets.push(v);
    out=out.split(m[0]).join(v||'');
  }
  out=out.replace(/\{\{var:([^}]+)\}\}/g,(m,n)=>String(vars[n.trim()]??''));
  return out.slice(0,8000);
}
function drRedact(s,secrets){
  let o=String(s==null?'':s);
  for(const v of secrets)if(v)o=o.split(v).join('[REDACTED]');
  return o.slice(0,4000);
}
function drSafePreview(text){
  return String(text==null?'':text)
    .replace(/\{\{cred:([^}]+)\}\}/g,(m,n)=>'[vault:'+n.trim()+']')
    .replace(/\{\{var:([^}]+)\}\}/g,(m,n)=>'[result:'+n.trim()+']')
    .slice(0,140);
}
async function drRun(r,opts={}){
  if(drRunning&&!opts.dryRun)return 'Another routine is still running.';
  const v=drValidate(r);if(v.error)return v.error;
  const route=v.routine,secrets=[],vars={},log=[];
  // Test is a real validation preview but performs no fetch/model/say/notify/
  // share/wait step. It is safe to use on an unapproved routine.
  if(opts.dryRun){
    return 'DRY RUN — nothing was executed.\n'+route.steps.map((s,i)=>{
      const blocked=s.op==='fetch'&&!drAllowed(s.url)?' [BLOCKED — host not allowed]':'';
      const detail=s.url||s.prompt||s.text||s.title||'';
      return (i+1)+'. '+s.op+blocked+(detail?' · '+drSafePreview(detail):'');
    }).join('\n');
  }
  drRunning=true;
  try{
    for(const s of route.steps){
      try{
        if(s.op==='fetch'){
          const url=await drResolve(s.url,vars,secrets);
          if(!drAllowed(url)){log.push('fetch blocked — host is not approved');continue}
          const opt={method:s.method||'GET',headers:{'User-Agent':'OracleChat/1.0'}};
          if(s.method==='POST'){
            opt.headers['Content-Type']='application/json';
            opt.body=JSON.stringify({text:await drResolve(s.body||'',vars,secrets)});
          }
          const res=await fetch(url,opt),txt=(await res.text()).slice(0,4000);
          log.push('fetch '+res.status+': '+drRedact(txt.slice(0,180),secrets));
          if(s.saveAs)vars[s.saveAs]=txt;
        }else if(s.op==='model'){
          const a=await deviceChat([{from:'user',text:await drResolve(s.prompt||'',vars,secrets)}]);
          if(s.saveAs)vars[s.saveAs]=a;
          log.push('model: '+drRedact(String(a).slice(0,180),secrets));
        }else if(s.op==='say'){
          speak(drRedact(await drResolve(s.text||'',vars,secrets),secrets));
          log.push('spoke the reply');
        }else if(s.op==='notify'){
          if('Notification' in window&&Notification.permission==='granted'){
            new Notification(drRedact(await drResolve(s.title||'',vars,secrets),secrets),
              {body:drRedact(await drResolve(s.body||'',vars,secrets),secrets)});
            log.push('notification sent');
          }else log.push('notification skipped — alerts are not enabled');
        }else if(s.op==='share'){
          const t=drRedact(await drResolve(s.text||'',vars,secrets),secrets);
          if(navigator.share){await navigator.share({text:t});log.push('shared')}
          else log.push('sharing is unavailable in this browser');
        }else if(s.op==='wait'){
          await new Promise(ok=>setTimeout(ok,s.ms||1000));log.push('waited');
        }else if(s.op==='log'){
          log.push(drRedact(await drResolve(s.text||'',vars,secrets),secrets));
        }
      }catch(e){log.push(s.op+' failed: '+drRedact(e.message,secrets))}
    }
    const output=log.join('\n')||'Routine finished.';
    deviceRoutines.lastRun[route.id]=Date.now();
    const hist=Array.isArray(deviceRoutines.history[route.id])?deviceRoutines.history[route.id]:[];
    hist.push({at:Date.now(),name:route.name,output:output.slice(0,800)});
    deviceRoutines.history[route.id]=hist.slice(-10);
    drSave();
    return output;
  }finally{drRunning=false}
}
function drTick(){
  const now=new Date(),hhmm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  for(const r of Object.values(deviceRoutines.routines)){
    if(!r.trusted||!r.trigger||r.trigger.type==='manual')continue;
    const last=Number(deviceRoutines.lastRun[r.id]||0);
    // A daily trigger must fire once per calendar day, not on every tick inside
    // the matching minute. An interval waits that long after the last run.
    const due=r.trigger.type==='at'
      ?(r.trigger.time===hhmm&&new Date(last).toDateString()!==now.toDateString())
      :(Date.now()-last)>=r.trigger.minutes*60000;
    if(due){deviceRoutines.lastRun[r.id]=Date.now();drSave();drRun(r).catch(()=>{})}
  }
}

// Private models that fit a phone browser. wllama (llama.cpp compiled to
// WebAssembly) is used instead of Transformers.js because Transformers.js is
// the one browser runtime known to kill iPhone tabs during/after generation.
// GGUF files are downloaded from Hugging Face once, then cached on the device.
const GGUF_MODELS={
  'smol2-135m':{repo:'bartowski/SmolLM2-135M-Instruct-GGUF',file:'SmolLM2-135M-Instruct-Q4_K_M.gguf',name:'Tiny · 135M',size:'about 105 MB'},
  'lfm2-350m':{repo:'LiquidAI/LFM2.5-350M-GGUF',file:'LFM2.5-350M-Q4_K_M.gguf',name:'Balanced · 350M',size:'about 229 MB'},
  // A stronger private option that still fits an iPhone browser. The 1.7B Q4
  // build downloaded in 3 parallel shards but could not finish initializing on
  // a phone (1.1 GB weights + ~235 MB KV cache). Same Qwen3 family at 0.6B Q4:
  // clearly better than 350M, small enough to load and answer reliably.
  'qwen3-0.6b-smart':{repo:'bartowski/Qwen_Qwen3-0.6B-GGUF',file:'Qwen_Qwen3-0.6B-Q4_K_M.gguf',name:'Smart · 0.6B',size:'about 462 MB'},
  // Abliterated finetune of the same LFM2.5 350M base — same architecture,
  // chat template and wllama runtime, with fewer refusals. Same memory budget.
  'lfm2-350m-free':{repo:'mradermacher/LFM2.5-350M-abliterated-GGUF',file:'LFM2.5-350M-abliterated.Q4_K_M.gguf',name:'Unfiltered · 350M',size:'about 219 MB'},
};
const DEFAULT_DEVICE_MODEL='lfm2-350m';
const SMALL_DEVICE_MODEL='smol2-135m';
const SMART_DEVICE_MODEL='qwen3-0.6b-smart';
const FREE_DEVICE_MODEL='lfm2-350m-free';
const PHONE=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
// iOS Safari 27 accepts `new WebAssembly.Memory({address:'i64'})`, so wllama's
// feature probe thinks memory64 works. It does not: Safari then refuses to
// compile a module that actually declares memory64, and model initialization
// hangs forever with no error. Validate a real 13-byte memory64 module instead
// and, when it fails, hide JSPI so wllama selects its compat/Asyncify build.
// Desktop passes this probe and is left completely untouched.
const WASM_MEM64_PROBE=new Uint8Array([0,97,115,109,1,0,0,0,5,3,1,4,1]);
let wllamaCompatForced=false;
function forceWllamaCompat(w){
  if(!PHONE||wllamaCompatForced)return false;
  let valid=false;
  try{valid=WebAssembly.validate(WASM_MEM64_PROBE)}catch(e){}
  if(valid)return false;
  try{
    if(WebAssembly.Suspending){
      try{Object.defineProperty(WebAssembly,'Suspending',{value:undefined,configurable:true})}
      catch(e){WebAssembly.Suspending=undefined}
    }
    if(w&&typeof w.setCompat==='function')w.setCompat('default','firefox_safari');
    wllamaCompatForced=true;
  }catch(e){}
  return wllamaCompatForced;
}
function ggufSpec(id){
  if(GGUF_MODELS[id])return GGUF_MODELS[id];
  if(typeof id==='string'&&id.includes('|')){const [repo,file]=id.split('|');return {repo,file,name:file,size:'your model file'}}
  return null;
}
function activeDeviceModel(){return backend==='device-smart'?SMART_DEVICE_MODEL:backend==='device-small'?SMALL_DEVICE_MODEL:backend==='device-free'?FREE_DEVICE_MODEL:(customModels.find(m=>m.id===backend)?.model||DEFAULT_DEVICE_MODEL)}
function deviceModelStatus(){
  const id=activeDeviceModel(),spec=ggufSpec(id);
  if(devicePipe&&deviceModelId===id)return {title:'Private model is ready',sub:'Answers work offline on this device'};
  if(spec&&deviceSaved(id,spec))return {title:'Private model saved on this device',sub:'Reused on every load — no download again'};
  return {title:'Prepare private model now',sub:'Download once, then it stays on this device'};
}
const devicePipes={}, deviceLoads={};
// The byte counter can reach its total while wllama is still preparing the
// model. Say so instead of freezing on a misleading 99%.
function deviceSavingText(spec,loaded,total){
  if(total&&loaded>=total)return 'Downloaded — preparing '+spec.name+' on this device…';
  const pct=Math.min(99,Math.round(loaded/total*100));
  return 'Saving '+spec.name+' on this device — '+pct+'% ('+Math.round(loaded/1048576)+' / '+Math.round(total/1048576)+' MB)';
}
// Update the progress text in place. A full render() here destroys the input

// Remember the owner's go-ahead across refreshes. This flag only suppresses the
// one-time confirmation; wllama itself saves the GGUF in OPFS on the device.
let deviceOk=localStorage.getItem('oracle.device.ok')==='1';
// Every shard of a split model is a separate OPFS entry in wllama, so the saved
// check and the loader use the full list. The first URL is still the model's
// identity: wllama expands its -00001-of-00003.gguf name into all shards itself.
function hfModelUrls(spec){return (spec.shards||[spec.file]).map(f=>'https://huggingface.co/'+spec.repo+'/resolve/main/'+f)}

function deviceSaved(modelId,spec){
  try{
    const x=JSON.parse(localStorage.getItem(deviceSavedKey(modelId))||'null');
    return !!x&&x.url===hfModelUrl(spec);
  }catch(e){return false}
}
function markDeviceSaved(modelId,spec,size){
  try{localStorage.setItem(deviceSavedKey(modelId),JSON.stringify({url:hfModelUrl(spec),size:size||0,at:Date.now()}))}catch(e){}
}
function clearDeviceSaved(modelId){try{localStorage.removeItem(deviceSavedKey(modelId))}catch(e){}}
// wllama 3.x persists weights in OPFS and exposes them via cacheManager. The
// exact key is the resolve URL stored in metadata.originalURL. The Cache API is
// only a legacy fallback; it is not where these model files live.
async function deviceCacheInfo(w,spec,modelId){
  const urls=hfModelUrls(spec), url=urls[0];
  let known=false,size=0,checked=false;
  try{
    if(w&&w.cacheManager&&typeof w.cacheManager.list==='function'){
      const list=await w.cacheManager.list()||[];checked=true;
      // wllama stores one OPFS entry per shard, each keyed by its own URL.
      // A split model is only "saved" once every shard is present.
      const found=new Set();

// The format choice is made by the model that is already loaded for the image,

async function modelPicksSize(rt,session,prompt){
  const labels=[['1:1','a square social media feed post'],['4:5','a tall portrait social media feed post'],
    ['9:16','a vertical story or reel'],['16:9','a wide landscape banner or thumbnail']];
  const pv=await clipEmbed(rt,session,prompt);let best='1:1',score=-Infinity;
  for(const [id,label] of labels){const v=await clipEmbed(rt,session,label);const s=cosine(pv,v);if(s>score){score=s;best=id}}

function imageNoise(n,seed){

  src.getContext('2d').putImageData(img,0,0);

  const x=Math.floor((512-cw)/2),y=Math.floor((512-ch)/2);

async function imageStage(name,fn){

  try{return await fn()}
  catch(e){
    const raw=(e&&e.message)||String(e),named=(e&&e.name&&e.name!=='Error')?e.name+': ':'';

async function generateImageBlob(prompt,sizeId,seed,progress){

  const enc=await imageStage('text encoder load',()=>imageSession(rt.ort,rt.manifest.models.textEncoder,'encoder'));
  let embF,chosen=sizeId;
  try{
    embF=await imageStage('prompt embedding',()=>clipEmbed(rt,enc,prompt));
    if(sizeId==='auto'){chosen=await imageStage('format choice',()=>modelPicksSize(rt,enc,prompt));progress(48,'Model chose '+chosen+' — generating…')}

  let pred;

    const sample=toHalfTensor(rt.ort,modelIn,[1,4,64,64]);
    const timestep=new rt.ort.Tensor('float32',new Float32Array([sch.timestep]),[1]);

      const out=(await imageStage('unet run',()=>unet.run({sample,timestep,encoder_hidden_states:emb}))).noise_pred;

  try{
    const lt=toHalfTensor(rt.ort,denoised,[1,4,64,64]);

function isContextOverflow(err){
  // iOS wllama reports an exhausted KV buffer as "length out of range buffer",
  // not as a token/context error. Treat both as overflow so the short-history
  // retries below still run for long chats.
  return /context size|context length|exceeds.*tokens|too many tokens|n_ctx|out of range|buffer|too long/i.test(String((err&&err.message)||err||''));

// Keep the newest turns first and stay inside a conservative character budget.
// Older turns are dropped before the model sees them, so a long chat cannot
// grow past the device context window. The budget and system limit are tunable
// for the final, tightest retry.
function fitDeviceMessages(messages,budget=DEVICE_INPUT_CHARS,sysChars=1200){
  const list=Array.isArray(messages)?messages:[];
  const sys=list.find(m=>m&&m.from==='system'&&String(m.text||'').trim());
  const out=sys?[{role:'system',content:String(sys.text).trim().slice(0,sysChars)}]:[];
  let chars=out.reduce((n,m)=>n+m.content.length,0);
  for(let i=list.length-1;i>=0;i--){
    const m=list[i];
    if(!m||m.from==='system')continue;
    const text=String(m.text||'').trim();
    if(!text||out.length>=9)break;
    const room=budget-chars;
    if(room<=0)break;
    const piece=text.length>room?text.slice(-room):text;
    out.splice(sys?1:0,0,{role:m.from==='user'?'user':'assistant',content:piece});
    chars+=piece.length;
    if(piece.length<text.length)break;
  }
  if(out.length===(sys?1:0)){
    const last=list.length?list[list.length-1]:null;
    out.push({role:'user',content:String((last&&last.text)||'').slice(-budget)});
  }
  return out;
}
async function deviceCompletion(w,chat){
  let timer=null;
  const timeout=new Promise((_,rej)=>{timer=setTimeout(()=>rej(new Error('This device took too long — tap retry to try again.')),120000)});
  try{
    const stream=await Promise.race([w.createChatCompletion({messages:chat,stream:true,cache_prompt:true}),timeout]);
    let out='';
    for await(const chunk of stream){out+=chunk.choices?.[0]?.delta?.content||''}
    return guestFill(out.trim()||'(no answer)');
  }finally{if(timer)clearTimeout(timer)}

async function deviceChat(messages,modelId,shortOnly=false){
  const w=await loadDeviceModel(modelId),list=Array.isArray(messages)?messages:[];
  // Keep the personality instruction on every retry: trimming history is fine,
  // but dropping the system message would silently change the bot's tone.
  const sys=list.filter(m=>m&&m.from==='system'&&String(m.text||'').trim()).slice(0,1);
  const hist=list.filter(m=>!m||m.from!=='system');
  // First normal fit; if the runtime still reports an overflow, retry with only
  // the last exchange and finally only the newest message.
  const tight=fitDeviceMessages([...sys,...hist.slice(-1)],1600,400);
  // A manual "Retry with short history" skips the wider attempts entirely.
  const attempts=shortOnly?[tight]:[fitDeviceMessages([...sys,...hist]),fitDeviceMessages([...sys,...hist.slice(-2)]),fitDeviceMessages([...sys,...hist.slice(-1)]),tight];
  for(const chat of attempts){
    try{return await deviceCompletion(w,chat)}
    catch(err){if(!isContextOverflow(err))throw err}
  }
  throw new Error('This chat is too long for the private model. Tap “Retry with short history” to answer using just this question.');
}
async function customCloudChat(cm,messages){

  if(key)headers.Authorization='Bearer '+key;
  let r,d;
  try{
    r=await fetch(cm.endpoint,{method:'POST',headers,body:JSON.stringify({
      model:cm.model,
      messages:messages.map(m=>({role:m.from==='system'?'system':(m.from==='user'?'user':'assistant'),content:m.text}))
    })});
  }catch(err){throw new Error('Could not reach endpoint — it may block browser requests (CORS).')}
  try{d=await r.json()}catch(e){throw new Error('Endpoint returned non-JSON (HTTP '+r.status+')')}

  const answer=d.choices?.[0]?.message?.content??d.choices?.[0]?.text??d.response??'';

function cancelSpeech(){
  speechGen++;
  if(speechFallbackTimer){clearTimeout(speechFallbackTimer);speechFallbackTimer=null}
  if(!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel();
  setTimeout(()=>window.speechSynthesis.cancel(),80);
}
// iOS Safari only allows speech after a user gesture and sometimes leaves the
// synthesis engine paused with no voices loaded. Prime it from the call-button
// tap (a real gesture) so the spoken reply actually plays on a phone.
function primeSpeech(){
  if(!('speechSynthesis' in window))return;
  try{window.speechSynthesis.getVoices()}catch(e){}
  try{window.speechSynthesis.resume()}catch(e){}
  if(speechUnlocked)return;
  try{
    const u=new SpeechSynthesisUtterance(' ');u.volume=0;u.rate=1;
    window.speechSynthesis.speak(u);
    speechUnlocked=true;
  }catch(e){}
}
function speak(text,onDone){
  const gen=++speechGen;
  let done=false;
  if(speechFallbackTimer){clearTimeout(speechFallbackTimer);speechFallbackTimer=null}
  const finish=()=>{
    if(done||gen!==speechGen)return;
    done=true;
    if(speechFallbackTimer){clearTimeout(speechFallbackTimer);speechFallbackTimer=null}
    if(onDone)onDone();
  };
  if(!voiceReplies||!('speechSynthesis' in window)){finish();return}
  try{window.speechSynthesis.resume()}catch(e){}
  window.speechSynthesis.cancel();
  const clean=String(text||'').replace(/\[\[USE:[^\]]+\]\]/g,'').replace(/\s+/g,' ').slice(0,1200);
  if(!clean.trim()){finish();return}
  const u=new SpeechSynthesisUtterance(clean),v=voiceName();
  if(v)u.voice=v;
  u.rate=1.0;u.pitch=.8;
  u.onend=finish;u.onerror=finish;
  if(callActive)setCallState('speaking');
  // iOS can silently never fire onend. A bounded fallback keeps the hands-free
  // loop alive so the call does not freeze after replying once.
  const est=Math.min(30000,Math.max(4000,clean.length*90));
  speechFallbackTimer=setTimeout(()=>{if(gen===speechGen)finish()},est+3000);
  try{window.speechSynthesis.speak(u)}catch(e){finish()}
}

}
function trackRecognition(r){liveRecognitions.add(r);return r}
// Release every recognition instance. Nulling the handlers first stops a stale
// onend/onerror from re-entering the call loop while we are tearing it down.
function stopAllRecognition(){
  for(const r of liveRecognitions){
    try{r.onstart=r.onresult=r.onerror=r.onend=null}catch(e){}
    try{r.abort()}catch(e){}
    try{r.stop()}catch(e){}
  }
  liveRecognitions.clear();
  recognition=null;listening=false;
}
function endCall(message){
  if(!callActive)return;
  callActive=false;callState='idle';
  callGen++;
  if(listenTimer){clearTimeout(listenTimer);listenTimer=null}
  stopAllRecognition();
  // Restore the speaker setting from before the call — ending a call must not
  // leave later chat replies talking out loud or the mic indicator on.
  voiceReplies=prevVoiceReplies;
  try{localStorage.setItem('oracle.voiceReplies',voiceReplies?'1':'0')}catch(e){}
  cancelSpeech();render();
  showToast(message||(voiceReplies?'Voice call ended — spoken replies still on':'Voice call ended — replies back to text'));
}
function toggleListen(){
  if(callActive){endCall();return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showToast('Voice typing is not supported in this browser');return}
  if(listening&&recognition){try{recognition.stop()}catch(e){};return}
  try{
    const r=trackRecognition(new SR());recognition=r;
    r.lang='en-US';r.continuous=false;r.interimResults=true;
    r.onstart=()=>{listening=true;render()};
    r.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;draft=t.trim();render()};
    r.onerror=e=>showToast('Voice error: '+e.error);
    r.onend=()=>{liveRecognitions.delete(r);if(recognition===r)recognition=null;listening=false;render()};
    r.start();
  }catch(err){showToast('Could not start voice typing: '+err.message)}
}
function listenLoop(){
  if(!callActive)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showToast('Live voice needs Chrome or Android Chrome');endCall();return}
  finalTranscript='';callFatal=false;
  const gen=callGen,active=()=>callActive&&gen===callGen;
  if(listenTimer){clearTimeout(listenTimer);listenTimer=null}
  try{
    const r=trackRecognition(new SR());recognition=r;
    r.lang='en-US';r.continuous=false;r.interimResults=true;
    r.onstart=()=>{if(active()){listening=true;setCallState('listening')}};
    r.onresult=e=>{
      if(!active())return;
      let fin='',inter='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const seg=e.results[i];
        if(seg.isFinal)fin+=seg[0].transcript+' ';else inter+=seg[0].transcript;
      }
      if(fin){finalTranscript+=fin;callNoSpeech=0}
      const shown=(finalTranscript+inter).trim();
      const inp=document.getElementById('draft');if(inp)inp.value=shown;
      const send=document.getElementById('send');if(send)send.disabled=!shown;
      draft=shown;
    };
    r.onerror=e=>{
      if(!active())return;
      if(e.error==='no-speech'||e.error==='aborted')return;
      // Permission, missing microphone or service errors repeat forever if we
      // auto-retry. End the call so the page stays responsive and mic releases.
      callFatal=true;
      endCall('Voice unavailable ('+e.error+') — check mic permission, then tap call again');
    };
    r.onend=()=>{
      liveRecognitions.delete(r);
      if(!active())return;
      listening=false;
      const t=finalTranscript.trim();
      if(t){draft=t;callNoSpeech=0;sendMessage({preventDefault(){}});return}
      callNoSpeech++;
      if(callNoSpeech>=4){endCall('No speech heard — tap the call button to try again');return}
      if(!waiting&&callState!=='speaking')listenTimer=setTimeout(()=>{if(active())listenLoop()},400);
    };
    r.start();
  }catch(err){showToast('Could not start live voice: '+err.message);endCall()}
}
function toggleCall(){
  if(callActive){endCall();return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showToast('Live voice needs Chrome or Android Chrome');return}
  primeSpeech();
  prevVoiceReplies=voiceReplies;
  callNoSpeech=0;callFatal=false;
  callActive=true;voiceReplies=true;
  try{localStorage.setItem('oracle.voiceReplies','1')}catch(e){}
  render();showToast('Voice call started — just talk');listenLoop();
}

          ${files.map((f,i)=>`<span class="chip">📎 ${esc(f)} <button data-rmf="${i}">×</button></span>`).join('')}
          ${credSelected.map((k,i)=>`<span class="chip">🔒 ${esc(k)} <button data-rmc="${i}">×</button></span>`).join('')}
        </div>`:''}
        <form class="composer" id="composer">
          <button type="button" class="composer-plus ${plusOpen?'open':''}" id="plusBtn" title="Add">${icon('plus')}</button>
          ${staticMode||guestMode?'':`<button type="button" class="composer-plus" id="seeThis" title="See this — ask the local model about the webcam view">${icon('camera')}</button>`}
          ${staticMode&&!guestMode?`<button type="button" class="composer-plus" id="imageBtn" title="Make an image on this device">${icon('spark')}</button>`:''}
          <button type="button" class="composer-plus ${listening?'listening':''}" id="micBtn" title="Speak instead of type">${icon('mic')}</button>
          <input id="draft" value="${esc(draft)}" placeholder="Message ${esc(c.name)}" autocomplete="off" />
          <button type="submit" class="composer-send" id="send" ${draft.trim()||files.length?'':'disabled'}>${icon('arrow')}</button>
          ${plusOpen?`<div class="dropdown plus">
            <button class="menu-item" id="attachItem">${icon('file',18)}<span><strong>Attach a file</strong><span class="mi-sub">Send text file contents</span></span></button>
            <div class="menu-sep"></div>
            <button class="menu-item" id="${staticMode?'gvCredItem':'credItem'}">${icon('lock',18)}<span><strong>Use a saved login</strong><span class="mi-sub">Value stays hidden from model</span></span></button>
            ${staticMode?'':`<div class="menu-sep"></div>
            <button class="menu-item" id="skillItem">${icon('spark',18)}<span><strong>Teach a Skill</strong><span class="mi-sub">Add an instruction</span></span></button>`}
          </div>`:''}
        </form>
      </div>`;
  }

  document.getElementById('app').innerHTML=`
    <aside class="sidebar">
      <div class="sidebar-top"><div class="workspace"><span class="dot"></span><span class="workspace-name">Oracle</span><span class="workspace-sub">• Live</span></div>
      <button class="icon-btn" id="newChat" title="New chat">${icon('plus')}</button></div>
      ${nav}
      <button class="profile ${profileOpen?'open':''}" id="profileBtn" title="Profile, vault and name">
        <div class="avatar">${initials(displayName)}</div>
        <div class="profile-info"><span class="profile-name">${esc(displayName)}</span><span class="profile-sub">${staticMode?'Private · on this device':'Local + free cloud'}</span></div>
        <span class="profile-caret">⌃</span>
      </button>
      ${profileOpen?`<div class="dropdown profile-menu">
        ${staticMode?`<button class="menu-item" id="openGuestVault">${icon('lock',18)}<span><strong>My Vault</strong><span class="mi-sub">Encrypted on this device</span></span></button>
        <button class="menu-item" id="openDeviceRoutines">${icon('spark',18)}<span><strong>My Routines</strong><span class="mi-sub">Make this app do things on its own</span></span></button>
        ${guestMode?'':`<button class="menu-item" id="openWebSearch">${icon('search',18)}<span><strong>Web search: ${webSearchOn()?'On':'Off'}</strong><span class="mi-sub">Current info for private chat</span></span></button>`}<div class="menu-sep"></div>`:`<button class="menu-item" id="openVault">${icon('lock',18)}<span><strong>Credential Vault</strong><span class="mi-sub">macOS Keychain — values hidden</span></span></button>
        <button class="menu-item" id="openMemory">${icon('spark',18)}<span><strong>My Memory</strong><span class="mi-sub">Notes &amp; skills the model recalls</span></span></button>
        <button class="menu-item" id="openRoutines">${icon('spark',18)}<span><strong>Web Routines</strong><span class="mi-sub">Email, webhooks &amp; browser actions</span></span></button>
        <div class="menu-sep"></div>`}
        <button class="menu-item" id="installApp">${icon('plus',18)}<span><strong>Install this web app</strong><span class="mi-sub">${installPrompt?'Add Oracle to your device':'Add to Home Screen / Install'}</span></span></button>
        <button class="menu-item" id="openAbout">${icon('info',18)}<span><strong>About / Update status</strong><span class="mi-sub">Build, model and service worker</span></span></button>
        <button class="menu-item" id="toggleTheme">${icon('theme',18)}<span><strong>Appearance: ${themeLabel()}</strong><span class="mi-sub">System, light or dark — tap to change</span></span></button>
        <button class="menu-item" id="openCommandPalette">${icon('search',18)}<span><strong>Command palette</strong><span class="mi-sub">Jump to any chat or routine</span></span></button>
        <button class="menu-item" id="openBotRoster">${icon('spark',18)}<span><strong>Bot roster</strong><span class="mi-sub">Names, jobs and the primary bot</span></span></button>
        <div class="menu-sep"></div>
        <button class="menu-item" id="editName">${icon('edit',18)}<span><strong>Change display name</strong><span class="mi-sub">Shown in the sidebar</span></span></button>
      </div>`:''}
    </aside>
    <main class="main" style="--hero:${heroColor(c.hero)}">${mainContent}</main>
    ${(plusOpen||modelOpen||profileOpen||moreOpen)?'<div class="backdrop" id="backdrop"></div>':''}
    ${modal||''}
    <input type="file" id="fileInput" style="display:none" multiple />`;
  // A phone tab can be reclaimed during WebGPU generation. Remember the last
  // screen so a reload returns to the chat with the generated image, not to the
  // chat list where it looks like the image vanished.
  try{localStorage.setItem('oracle.mobileView',mobileView)}catch(e){}
  document.getElementById('app').dataset.mobile=mobileView;
  const m=document.getElementById('messages');if(m)m.scrollTop=m.scrollHeight;
  bind();
}

function bind(){
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;plusOpen=modelOpen=profileOpen=moreOpen=false;render()});
  document.querySelectorAll('[data-list-view]').forEach(b=>b.onclick=()=>{listView=b.dataset.listView;localStorage.setItem('oracle.listView',listView);render()});
  document.querySelectorAll('.conv').forEach(b=>b.onclick=()=>{
    activeId=b.dataset.id;const target=convs.find(x=>x.id===activeId);if(target)activeFolder=target.folder;
    view='chat';mobileView='chat';plusOpen=modelOpen=profileOpen=moreOpen=false;saveState();render();
  });
  document.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{
    const f=folders.find(x=>x.id===b.dataset.folder);if(!f)return;
    activeFolder=f.id;f.open=!f.open;
    const phone=window.matchMedia('(max-width:640px)').matches;
    if(f.open&&!phone){const first=convs.find(x=>x.folder===f.id);if(first)activeId=first.id}
    view='chat';if(!phone)mobileView='chat';saveState();render();
  });
  document.querySelectorAll('[data-mobile-back]').forEach(b=>b.onclick=()=>{
    mobileView='list';if(view!=='chat')view='chat';
    plusOpen=modelOpen=profileOpen=moreOpen=false;render();
  });
  document.querySelectorAll('[data-folder-menu]').forEach(b=>b.onclick=e=>{e.stopPropagation();openFolderMenu(b.dataset.folderMenu)});
  document.querySelectorAll('[data-conv-menu]').forEach(b=>b.onclick=e=>{e.stopPropagation();openChatMenu(b.dataset.convMenu)});
  document.getElementById('newFolder')?.addEventListener('click',()=>openFolderModal());
  document.querySelectorAll('[data-new-in]').forEach(b=>b.onclick=()=>openRoomModal(b.dataset.newIn));
  document.getElementById('newChat')?.addEventListener('click',()=>openRoomModal(activeFolder));
  bindDragDrop();
  const mb=document.getElementById('moreBtn');
  if(mb)mb.onclick=e=>{e.stopPropagation();moreOpen=!moreOpen;plusOpen=modelOpen=profileOpen=false;modal=null;render()};
  document.getElementById('moreNewChat')?.addEventListener('click',()=>{moreOpen=false;openRoomModal(activeFolder)});
  document.getElementById('moreNewFolder')?.addEventListener('click',()=>{moreOpen=false;openFolderModal()});
  document.getElementById('morePersonality')?.addEventListener('click',()=>{moreOpen=false;openPersonalityPicker()});
  document.getElementById('moreToolMode')?.addEventListener('click',async()=>{
    const next=(status.tools?.mode||'auto')==='auto'?'ask':'auto';
    try{
      const r=await api('/api/tools/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:next})});
      status.tools=r;moreOpen=false;render();showToast('Tool mode: '+(r.mode==='auto'?'Auto — no approvals':'Ask first'));
    }catch(err){showToast('Could not change tool mode: '+err.message)}
  });
  document.getElementById('moreToolRules')?.addEventListener('click',()=>{moreOpen=false;openToolRules()});
  document.getElementById('moreRename')?.addEventListener('click',()=>{moreOpen=false;openRenameModal('chat',activeId)});
  document.getElementById('moreMove')?.addEventListener('click',()=>{moreOpen=false;openMoveModal(activeId)});
  document.getElementById('moreDelete')?.addEventListener('click',()=>{moreOpen=false;openDeleteChatModal(activeId)});
  document.getElementById('moreSmartName')?.addEventListener('click',()=>{moreOpen=false;smartChat('name',activeId)});
  document.getElementById('moreSmartFolder')?.addEventListener('click',()=>{moreOpen=false;smartChat('folder',activeId)});
  document.getElementById('moreSmartSummary')?.addEventListener('click',()=>{moreOpen=false;smartChat('summary',activeId)});
  document.getElementById('voiceBtn')?.addEventListener('click',()=>toggleVoice());
  document.getElementById('callBtn')?.addEventListener('click',()=>toggleCall());
  document.getElementById('endCall')?.addEventListener('click',()=>toggleCall());
  document.getElementById('moreVoice')?.addEventListener('click',()=>{moreOpen=false;toggleVoice()});
  document.getElementById('moreVoicePick')?.addEventListener('click',()=>{moreOpen=false;openVoicePicker()});
  document.getElementById('micBtn')?.addEventListener('click',()=>toggleListen());
  document.getElementById('seeThis')?.addEventListener('click',()=>{if(!staticMode&&!guestMode)openCameraModal()});
  document.getElementById('shareBtn')?.addEventListener('click',()=>{moreOpen=false;modal=null;openShareModal()});
  document.getElementById('moreShare')?.addEventListener('click',()=>{moreOpen=false;openShareModal()});
  document.getElementById('vaultBack')?.addEventListener('click',()=>{view='chat';render()});
  const profileBtn=document.getElementById('profileBtn');
  if(profileBtn)profileBtn.onclick=e=>{e.stopPropagation();profileOpen=!profileOpen;plusOpen=modelOpen=moreOpen=false;render()};
  document.getElementById('openVault')?.addEventListener('click',()=>{view='vault';mobileView='chat';profileOpen=false;render()});
  document.getElementById('openGuestVault')?.addEventListener('click',()=>{view='guestvault';mobileView='chat';profileOpen=false;render()});
  document.getElementById('gvBack')?.addEventListener('click',()=>{view='chat';render()});
  document.getElementById('gvAdd')?.addEventListener('click',()=>{
    modal=`<div class="modal-backdrop" id="mb"><div class="modal"><h3>Add credential</h3><p>Stored encrypted on this device only.</p>
      <input id="gvk" placeholder="Credential name (e.g. wifi-password)" style="width:100%;box-sizing:border-box"/>
      <input id="gvv" type="password" placeholder="Value" style="width:100%;box-sizing:border-box;margin-top:8px"/>
      <div class="modal-actions"><button class="btn" id="mc">Cancel</button><button class="btn primary" id="gvSave">Save</button></div></div></div>`;render();
    document.getElementById('gvSave')?.addEventListener('click',async()=>{
      const k=document.getElementById('gvk').value.trim(),v=document.getElementById('gvv').value;
      if(k&&v){await gvSet(k,v);showToast('Saved on this device: '+k)}
      modal=null;render();
    });
  });
  document.querySelectorAll('[data-gvdel]').forEach(b=>b.onclick=()=>{gvDel(b.dataset.gvdel);render()});
  document.getElementById('openMemory')?.addEventListener('click',async()=>{await loadMemory();view='memory';mobileView='chat';profileOpen=false;render()});
  document.getElementById('openRoutines')?.addEventListener('click',async()=>{profileOpen=false;await openRoutines()});
  document.getElementById('openDeviceRoutines')?.addEventListener('click',()=>{profileOpen=false;openDeviceRoutines()});
  document.getElementById('openWebSearch')?.addEventListener('click',()=>{profileOpen=false;openWebSearchSettings()});
  document.getElementById('installApp')?.addEventListener('click',()=>{profileOpen=false;openInstallApp()});
  document.getElementById('openAbout')?.addEventListener('click',()=>{profileOpen=false;openAbout()});
  document.getElementById('toggleTheme')?.addEventListener('click',()=>cycleTheme());
  document.getElementById('openCommandPalette')?.addEventListener('click',()=>{profileOpen=false;openCommandPalette()});
  document.getElementById('openBotRoster')?.addEventListener('click',()=>{profileOpen=false;openBotRoster()});
  document.getElementById('memoryBack')?.addEventListener('click',()=>{view='chat';render()});
  document.getElementById('addMemory')?.addEventListener('click',()=>{
    modal=`<div class="modal-backdrop" id="mb"><div class="modal"><h3>Add a memory</h3><p>A fact the model should remember later.</p>
      <textarea id="memText" rows="3" style="width:100%;box-sizing:border-box"></textarea>
      <div class="modal-actions"><button class="btn" id="mc">Cancel</button><button class="btn primary" id="memSave">Save</button></div></div></div>`;render();
    document.getElementById('memSave')?.addEventListener('click',async()=>{
      const t=document.getElementById('memText').value;
      if(t.trim()){await api('/api/memory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});await loadMemory();showToast('Memory saved')}
      modal=null;render();
    });
  });
  document.getElementById('editName')?.addEventListener('click',()=>{profileOpen=false;openNameModal()});
  const mp=document.getElementById('modelPill');
  if(mp)mp.onclick=e=>{e.stopPropagation();modelOpen=!modelOpen;plusOpen=profileOpen=moreOpen=false;render()};
  document.querySelectorAll('[data-model]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();backend=b.dataset.model;localStorage.setItem('oracle.backend',backend);
    modelOpen=false;render();showToast('Model: '+(allModels().find(m=>m.id===backend)?.name||backend));
  });
  document.querySelectorAll('[data-model-remove]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();const id=b.dataset.modelRemove;
    customModels=customModels.filter(m=>m.id!==id);saveCustomModels();gvDel('model:'+id);
    if(backend===id)backend=DEFAULT_BACKEND;
    modelOpen=false;render();showToast('Model removed');
  });
  document.getElementById('addModel')?.addEventListener('click',e=>{e.stopPropagation();modelOpen=false;openAddModel()});
  document.getElementById('preloadDevice')?.addEventListener('click',async e=>{
    e.stopPropagation();modelOpen=false;render();
    try{await loadDeviceModel(activeDeviceModel());showToast('Private model ready — answers work offline now')}
    catch(err){showToast('Could not load the model: '+err.message)}
  });
  const pb=document.getElementById('plusBtn');
  if(pb)pb.onclick=e=>{e.stopPropagation();plusOpen=!plusOpen;modelOpen=profileOpen=moreOpen=false;render()};
  document.getElementById('attachItem')?.addEventListener('click',e=>{e.stopPropagation();plusOpen=false;render();document.getElementById('fileInput').click()});
  document.getElementById('credItem')?.addEventListener('click',e=>{e.stopPropagation();plusOpen=false;render();openCredPicker()});
  document.getElementById('gvCredItem')?.addEventListener('click',e=>{
    e.stopPropagation();plusOpen=false;
    const names=gvNames();
    if(!names.length){showToast('Add a credential in My Vault first');render();return}
    modal=`<div class="modal-backdrop" id="mb"><div class="modal"><h3>Use a saved login</h3><p>Only the name is shared with the model — the value stays encrypted on this device.</p>
      ${names.map(n=>`<button class="menu-item" data-gvpick="${esc(n)}">${icon('lock',18)}<span><strong>${esc(n)}</strong></span></button>`).join('')}
      <div class="modal-actions"><button class="btn" id="mc">Cancel</button></div></div></div>`;render();
    document.querySelectorAll('[data-gvpick]').forEach(b=>b.onclick=()=>{if(!credSelected.includes(b.dataset.gvpick))credSelected.push(b.dataset.gvpick);modal=null;render();showToast('Selected '+b.dataset.gvpick+' (value hidden)')});
  });
  document.getElementById('skillItem')?.addEventListener('click',e=>{e.stopPropagation();plusOpen=false;render();openSkillModal()});
  document.getElementById('addCred')?.addEventListener('click',()=>openAddCred());
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await api('/api/vault/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:b.dataset.del})});vaultKeys=(await api('/api/vault/list')).keys;render();showToast('Removed '+b.dataset.del)});
  document.getElementById('backdrop')?.addEventListener('click',()=>{plusOpen=modelOpen=profileOpen=moreOpen=false;render()});
  document.querySelectorAll('[data-rmf]').forEach(b=>b.onclick=()=>{files.splice(+b.dataset.rmf,1);render()});
  document.querySelectorAll('[data-rmc]').forEach(b=>b.onclick=()=>{credSelected.splice(+b.dataset.rmc,1);render()});
  document.querySelectorAll('[data-tool-approve]').forEach(b=>b.onclick=()=>toolAction(+b.dataset.toolApprove,'once'));
  document.querySelectorAll('[data-tool-always]').forEach(b=>b.onclick=()=>toolAction(+b.dataset.toolAlways,'always'));
  document.querySelectorAll('[data-tool-deny]').forEach(b=>b.onclick=()=>toolAction(+b.dataset.toolDeny,'deny'));
  document.getElementById('retrySend')?.addEventListener('click',()=>{
    const c=active(),last=c.messages.at(-1);
    if(!last||last.from!=='user')return;
    c.messages.pop();draft=last.text.replace(/\n\[Attached files:[^\]]*\]$/,'');
    saveState();sendMessage({preventDefault(){}});
  });
  document.querySelectorAll('[data-retry-msg]').forEach(b=>b.onclick=()=>{
    const c=active(),i=+b.dataset.retryMsg;
    const prev=[...c.messages.slice(0,i)].reverse().find(x=>x&&x.from==='user');
    if(!prev)return;
    c.messages.splice(i,1);
    draft=prev.text.replace(/\n\[Attached files:[^\]]*\]$/,'');
    nextSendShort=backend==='device'||backend==='device-small'||backend==='device-smart'||backend==='device-free'||!!customModels.find(m=>m.id===backend&&m.type==='device');
    saveState();sendMessage({preventDefault(){}});
  });
  // Image generation is phone/static and owner-only. No bridge call is made.
  document.getElementById('imageBtn')?.addEventListener('click',()=>{imageResultBlob=null;if(imageResultUrl)URL.revokeObjectURL(imageResultUrl);imageResultUrl='';imageStatusText='';openImageModal()});
  document.getElementById('preloadImage')?.addEventListener('click',e=>{e.stopPropagation();modelOpen=false;imageResultBlob=null;if(imageResultUrl)URL.revokeObjectURL(imageResultUrl);imageResultUrl='';imageStatusText='';openImageModal()});
  document.getElementById('imgPrompt')?.addEventListener('input',e=>{imagePrompt=e.target.value});
  document.querySelectorAll('[data-img-size]').forEach(b=>b.onclick=()=>{imageSize=b.dataset.imgSize;openImageModal()});
  document.querySelectorAll('[data-img-engine]').forEach(b=>b.onclick=()=>{setImageEngine(b.dataset.imgEngine);openImageModal()});
  document.getElementById('imgGo')?.addEventListener('click',startImageGeneration);
  document.getElementById('imgCancel')?.addEventListener('click',()=>{modal=null;render()});
  document.getElementById('imgResultDownload')?.addEventListener('click',()=>downloadImageBlob(imageResultBlob,'oracle-image-latest.png'));
  document.getElementById('imgResultCopy')?.addEventListener('click',()=>copyImageBlob(imageResultBlob));
  document.querySelectorAll('[data-img-download]').forEach(b=>b.onclick=async()=>{
    const blob=await imageStoreGet(b.dataset.imgDownload);
    if(!blob){showToast('Image is no longer on this device');return}
    downloadImageBlob(blob,'oracle-image-'+b.dataset.imgDownload+'.png');
  });
  document.querySelectorAll('[data-img-copy]').forEach(b=>b.onclick=async()=>{
    const blob=await imageStoreGet(b.dataset.imgCopy);
    if(!blob){showToast('Image is no longer on this device');return}
    copyImageBlob(blob);
  });
  hydrateImages();
  document.getElementById('fileInput')?.addEventListener('change',async e=>{
    for(const f of e.target.files){files.push(f.name)}
    e.target.value='';render();showToast(files.length+' file(s) attached (name shown)');
  });
  bindModal();
  const input=document.getElementById('draft'), send=document.getElementById('send');
  if(input){input.oninput=()=>{draft=input.value;send.disabled=!draft.trim()&&!files.length};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('composer').requestSubmit()}}}
  document.getElementById('composer')?.addEventListener('submit',sendMessage);
}

function closeMenus(){plusOpen=modelOpen=profileOpen=moreOpen=false}
function heroPicker(field){
  return `<div class="hero-grid">${HEROES.map(h=>`<button type="button" class="hero-choice" data-hero="${h.id}" data-hero-field="${field}">${heroAvatar(h.id)}<span>${esc(h.name)}</span></button>`).join('')}</div>`;
}
function openRoomModal(folderId=activeFolder){
  modal=`<div class="modal-backdrop" id="mb"><div class="modal"><h3>New chat room</h3><p>Name the room and pick its pixel agent. The agent stands beside the room title.</p>
    <form id="roomForm"><label>Room name</label><input id="rn" placeholder="e.g. Marketing ideas" maxlength="50" required autofocus onfocus="this.select()" onclick="this.select()"/>

function openFolderModal(folderId=null){

function openFolderMenu(id){

function openChatMenu(id){
  const c=convs.find(x=>x.id===id);if(!c)return;
  modal=`<div class="modal-backdrop" id="mb"><div class="modal"><h3>${esc(c.name)}</h3><p>Chat options</p>
    <button class="menu-item" data-cm="rename" data-id="${c.id}">${icon('edit',18)}<span><strong>Rename chat</strong></span></button>

async function smartChat(kind,chatId=activeId){
  const c=convs.find(x=>x.id===chatId);if(!c)return;
  if(!c.messages.length){showToast('Ask a question in this room first');return}
  const asks={
    name:'Suggest a short 2-5 word title for this chat. Reply with only the title, no quotes.',
    folder:'Suggest one short folder name where this chat belongs. Reply with only the folder name.',
    summary:'Summarize this chat in two short sentences. Reply with only the summary.',
  };
  const msgs=c.messages.slice(-10).map(m=>({from:m.from,text:m.text}));
  msgs.push({from:'user',text:asks[kind]});
  showToast('Smart action is thinking…');
  try{
    const r=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,backend:'local',credentials:[]})});
    let text=(r.answer||'').trim().replace(/^["']|["']$/g,'').replace(/\s+/g,' ');
    if(r.tool||!text){showToast('The local model could not do that yet');return}
    text=text.split('\n')[0].slice(0,90);
    if(kind==='name'){
      c.name=text;saveState();render();showToast('Room named: '+text);
    }else if(kind==='summary'){
      c.messages.push({from:'bot',text:'Smart summary: '+text,note:'local model'});
      c.preview='Smart summary added';saveState();render();showToast('Summary added to chat');
    }else{
      showSmartFolderModal(chatId,text);
    }
  }catch(err){showToast('Smart action failed: '+err.message)}
}

function bindDragDrop(){

    el.addEventListener('dragend',()=>{el.classList.remove('dragging');document.querySelectorAll('.drag-over').forEach(n=>n.classList.remove('drag-over'));draggingId=null});
  });
  document.querySelectorAll('[data-drop-folder]').forEach(el=>{
    el.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';el.classList.add('drag-over')});
    el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));

  });
